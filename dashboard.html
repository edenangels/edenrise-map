<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdenRise — Painel da Herdade</title>
<style>
:root{--bg:#141a15;--panel:#1d241b;--ink:#e6e3d4;--muted:#9ba391;--line:#333b2f;--accent:#8fae7e;--amber:#cda452;--red:#d3705e;--blue:#7fa8cc}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
h1{font-size:22px;margin:0} .sub{color:var(--muted);font-size:12px}
.langs button,.nav a{font-size:11px;padding:5px 9px;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:5px;cursor:pointer;text-decoration:none;margin-left:4px}
.langs button.on{color:var(--ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-height:112px;display:flex;flex-direction:column;gap:4px}
.card .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .v{font-size:28px;font-weight:700;line-height:1.1} .card .d{font-size:12px;color:var(--muted);margin-top:auto}
.card.wide{grid-column:span 2} .pill{display:inline-block;padding:2px 9px;border-radius:10px;font-weight:700;color:#111;font-size:12px}
h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
table{width:100%;border-collapse:collapse;font-size:12.5px} th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px} .bar i{display:block;height:100%}
svg{width:100%;height:60px} a{color:var(--blue)}
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body><div class="wrap">
<header><div><h1 id="ttl">EdenRise — Painel da Herdade</h1><div class="sub" id="sub"></div></div>
<div><span class="langs" id="langs"></span><span class="nav"><a href="index.html">2D</a><a href="3d.html">3D</a><a href="report.html" id="navrep">Relatório</a></span></div></header>
<div class="grid" id="kpis"></div>
<h2 id="h_fire"></h2><div class="tblwrap"><table id="t_fire"></table></div>
<h2 id="h_work"></h2><div class="grid" id="work"></div>
<h2 id="h_water"></h2><div class="tblwrap"><table id="t_water"></table></div>
<h2 id="h_hab"></h2><div class="tblwrap"><table id="t_hab"></table></div>
<div class="sub" style="margin-top:18px" id="foot"></div>
</div>
<script src="sat-data.js"></script><script src="alerts-data.js"></script><script src="work-data.js"></script>
<script src="defensible-data.js"></script><script src="water-data.js"></script><script src="habitat-data.js"></script>
<script src="suitability-data.js"></script><script src="trees-data.js"></script>
<script>
let LANG="pt"; try{LANG=localStorage.getItem("edr_lang")||((navigator.language||"pt").toLowerCase().startsWith("pt")?"pt":"en");}catch(e){}
const T={pt:{ttl:"EdenRise — Painel da Herdade",sub:"Estado da terra em tempo (quase) real · satélite, LiDAR, ClickUp",fire:"Fogo — espaço defensável por edifício",work:"Trabalho espelhado (ClickUp)",water:"Água — bacias, travessias e acumulação",hab:"Capital natural — ocupação do solo COS 2025",
  risk:"Risco de incêndio hoje",veg:"Vigor das pastagens (NDVI)",moist:"Humidade da vegetação (NDMI)",alerts:"Alertas de vegetação abertos",trees:"Árvores individuais",stressed:"Copas stressadas",oaks:"Candidatas a sobro/azinho",canopy:"Copado da herdade",suit:"Área apta para construir",runoff:"Escoamento 50 mm (todas as bacias)",cross:"Travessias de caminho em risco alto",
  cols:["#","Edifício","Score","Classe","Copado 30 m","Árvores altas 20 m","Declive","Água","Ações"],wcols:["Bacia","Área (ha)","Copado","Coef.","m³ @50 mm"],hcols:["Classe COS 2025","ha","% da herdade"],
  nodata:"sem dados ainda",synced:"sincronizado",rep:"Relatório",latest:"última passagem",since:"desde"},
 en:{ttl:"EdenRise — Estate Dashboard",sub:"State of the land, near-real-time · satellite, LiDAR, ClickUp",fire:"Fire — defensible space per building",work:"Mirrored work (ClickUp)",water:"Water — catchments, crossings & pooling",hab:"Natural capital — COS 2025 land cover",
  risk:"Fire risk today",veg:"Pasture vigour (NDVI)",moist:"Vegetation moisture (NDMI)",alerts:"Open vegetation alerts",trees:"Individual trees",stressed:"Stressed crowns",oaks:"Cork/holm-oak candidates",canopy:"Estate canopy",suit:"Build-suitable area",runoff:"Runoff for 50 mm (all catchments)",cross:"High-risk track crossings",
  cols:["#","Building","Score","Class","Canopy 30 m","Tall trees 20 m","Slope","Water","Actions"],wcols:["Catchment","Area (ha)","Canopy","Coef.","m³ @50 mm"],hcols:["COS 2025 class","ha","% of estate"],
  nodata:"no data yet",synced:"synced",rep:"Report",latest:"latest pass",since:"since"}};
const RCM={1:["Reduzido","Low","#8fae7e"],2:["Moderado","Moderate","#d4e157"],3:["Elevado","High","#ffb300"],4:["Muito elevado","Very high","#ff7043"],5:["Máximo","Maximum","#e53935"]};
const D=typeof DEFDATA!=="undefined"?DEFDATA.defensible_space.features:[], W=typeof WATERDATA!=="undefined"?WATERDATA:null, H=typeof HABDATA!=="undefined"?HABDATA:null,
      S=typeof SATDATA!=="undefined"?SATDATA:null, A=typeof ALERTDATA!=="undefined"?ALERTDATA.alerts.filter(a=>a.status==="aberto"):[], WK=typeof WORKDATA!=="undefined"?WORKDATA:null,
      SU=typeof SUITDATA!=="undefined"?SUITDATA.suitability_zones.features:[], TR=typeof TREEDATA!=="undefined"?TREEDATA.tree_tops.features:[];
let rcm=null;
function pasture(){ if(!S) return null; const by={}; for(const s of Object.values(S.series)){ if(s.kind!=="pastagem") continue; for(const [d,n,m] of s.pts){ const b=by[d]=by[d]||[0,0,0]; b[0]+=n;b[1]+=m;b[2]++; } }
  return Object.entries(by).sort().map(([d,b])=>[d,b[0]/b[2],b[1]/b[2]]); }
function spark(vals,color){ const W=260,Hh=60,p=4,lo=Math.min(...vals),hi=Math.max(...vals); const x=i=>p+i*(W-2*p)/(vals.length-1),y=v=>Hh-p-((v-lo)/Math.max(hi-lo,.05))*(Hh-2*p);
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none"><path d="${vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ")}" fill="none" stroke="${color}" stroke-width="2"/></svg>`; }
function card(k,v,d,extra=""){ return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>${extra}<div class="d">${d}</div></div>`; }
function render(){
  const t=T[LANG]; document.getElementById("ttl").textContent=t.ttl; document.getElementById("sub").textContent=t.sub; document.getElementById("navrep").textContent=t.rep;
  const L=document.getElementById("langs"); L.innerHTML=""; [["pt","Português"],["en","English"]].forEach(([c,l])=>{const b=document.createElement("button");b.textContent=l;if(c===LANG)b.classList.add("on");b.onclick=()=>{LANG=c;try{localStorage.setItem("edr_lang",c);}catch(e){}render();};L.appendChild(b);});
  const ps=pasture(); const last=ps?ps[ps.length-1]:null; const stressed=TR.filter(f=>f.properties.vigour==="stressado").length, oaks=TR.filter(f=>f.properties.oak_candidate).length;
  const r=rcm?RCM[rcm]:null;
  document.getElementById("kpis").innerHTML=[
    card(t.risk, r?`<span class="pill" style="background:${r[2]}">${LANG==="en"?r[1]:r[0]}</span>`:"—", "IPMA · Odemira · "+new Date().toISOString().slice(0,10)),
    card(t.veg, last?last[1].toFixed(2):"—", last?`${t.latest} ${last[0]}`:t.nodata, ps?spark(ps.map(x=>x[1]),"#8fae7e"):""),
    card(t.moist, last?last[2].toFixed(2):"—", last?`${t.latest} ${last[0]}`:t.nodata, ps?spark(ps.map(x=>x[2]),"#7fa8cc"):""),
    card(t.alerts, A.length, A.length?A.slice(0,2).map(a=>`${a.zone_name} ${a.metric.toUpperCase()} ${a.change_pct>0?"−":"+"}${Math.abs(a.change_pct).toFixed(0)}%`).join(" · "):(LANG==="en"?"none — stable vs. last 6 passes":"nenhum — estável vs. últimas 6 passagens")),
    card(t.trees, TR.length.toLocaleString(LANG==="en"?"en-GB":"pt-PT"), "LiDAR DGT 2024 · 50 cm"),
    card(t.stressed, stressed.toLocaleString(), `${(100*stressed/Math.max(TR.length,1)).toFixed(0)} % · NDVI 2025 (${LANG==="en"?"dry season":"época seca"})`),
    card(t.oaks, oaks.toLocaleString(), LANG==="en"?"by crown shape — confirm species in field":"pela forma da copa — confirmar espécie no terreno"),
    card(t.canopy, H?H.summary.canopy_pct_of_parcel+" %":"—", H?`${H.summary.canopy_ha} ha · ${H.summary.tree_co2e_stock_t_proxy} t CO₂e (${LANG==="en"?"proxy":"aproximação"})`:t.nodata),
    card(t.suit, SU.length?(SU.reduce((a,f)=>a+f.properties.area_m2,0)/1e4).toFixed(1)+" ha":"—", SU.length?`${SU.length} ${LANG==="en"?"zones, best":"zonas, melhor"}: ${SU[0].properties.name} (${SU[0].properties.score})`:t.nodata),
    card(t.runoff, W?W.catchments_runoff.features.reduce((a,f)=>a+f.properties.runoff_m3_50mm,0).toLocaleString()+" m³":"—", W?`${W.catchments_runoff.features.length} ${LANG==="en"?"catchments":"bacias"}`:t.nodata),
    card(t.cross, W?W.track_crossings.features.filter(f=>f.properties.risco==="alto").length:"—", W?`${W.track_crossings.features.length} ${LANG==="en"?"crossings total · inspect before autumn rain":"travessias no total · inspecionar antes das chuvas"}`:t.nodata),
  ].join("");
  document.getElementById("h_fire").textContent=t.fire;
  const col=c=>c==="fraca"?"#d3705e":(c==="moderada"?"#cda452":"#8fae7e");
  document.getElementById("t_fire").innerHTML=`<tr>${t.cols.map(c=>`<th>${c}</th>`).join("")}</tr>`+D.map(f=>{const p=f.properties;return `<tr><td>${p.rank_risk}</td><td>${p.name}</td><td><b style="color:${col(p.classe)}">${p.score}</b></td><td>${p.classe}</td><td>${p.canopy_cover_30m_pct}%</td><td>${p.tall_trees_20m}</td><td>${p.slope_mean_deg}°</td><td>${p.dist_water_m} m</td><td>${p.actions}</td></tr>`;}).join("");
  document.getElementById("h_work").textContent=t.work;
  const wk=document.getElementById("work");
  if(WK){ const items=Object.entries(WK.items); const by={}; for(const [k,w] of items){ const g=k.split("-")[0]; const b=by[g]=by[g]||{open:0,closed:0}; w.closed?b.closed++:b.open++; }
    wk.innerHTML=Object.entries(by).map(([g,b])=>card(g, `${b.open}<span style="font-size:14px;color:var(--muted)"> ${LANG==="en"?"open":"abertos"} · ${b.closed} ✓</span>`, `${t.synced} ${String(WK.synced).slice(0,16).replace("T"," ")}`, `<div class="bar"><i style="width:${100*b.closed/Math.max(b.open+b.closed,1)}%;background:var(--accent)"></i></div>`)).join(""); }
  else wk.innerHTML=card("🔁", "—", LANG==="en"?"mirror not synced yet (token pending)":"espelho ainda sem sincronização (token em falta)");
  document.getElementById("h_water").textContent=t.water;
  document.getElementById("t_water").innerHTML=`<tr>${t.wcols.map(c=>`<th>${c}</th>`).join("")}</tr>`+(W?W.catchments_runoff.features.map(f=>{const p=f.properties;return `<tr><td>${p.name}</td><td>${p.area_ha}</td><td>${p.canopy_cover_pct}%</td><td>${p.runoff_coef}</td><td>${p.runoff_m3_50mm.toLocaleString()}</td></tr>`;}).join(""):"");
  document.getElementById("h_hab").textContent=t.hab;
  const tot=H?Object.values(H.summary.cos2025_classes_ha).reduce((a,b)=>a+b,0):1;
  document.getElementById("t_hab").innerHTML=`<tr>${t.hcols.map(c=>`<th>${c}</th>`).join("")}</tr>`+(H?Object.entries(H.summary.cos2025_classes_ha).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td><td>${(100*v/tot).toFixed(1)}%<div class="bar"><i style="width:${100*v/tot}%;background:var(--accent)"></i></div></td></tr>`).join(""):"");
  document.getElementById("foot").textContent=(LANG==="en"?"Sources: Sentinel-2 (Earth Search), IPMA, EFFIS, DGT LiDAR 2024 & ORTOS-2025, COS 2025, ops.gpkg. Regenerated by the EdenRise GIS engines.":"Fontes: Sentinel-2 (Earth Search), IPMA, EFFIS, LiDAR DGT 2024 & ORTOS-2025, COS 2025, ops.gpkg. Gerado pelos motores GIS EdenRise.");
}
render();
fetch("https://api.ipma.pt/open-data/forecast/meteorology/rcm/rcm-d0.json").then(r=>r.json()).then(d=>{rcm=d.local&&d.local["0211"]?d.local["0211"].data.rcm:null;render();}).catch(()=>{});
</script></div></body></html>

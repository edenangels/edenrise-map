<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdenRise — Painel da Herdade</title>
<link rel="stylesheet" href="ui.css">
<style>
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 70px}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.hero h1{font-family:var(--display);font-size:34px;font-weight:600;margin:0;letter-spacing:-.02em;line-height:1} .hero .sub{color:var(--muted);font-size:13px;margin-top:6px}
.hero .ctl{display:flex;gap:8px;align-items:center}
.stage{margin:18px 0 4px}
.fireline{display:grid;grid-template-columns:1fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:6px} .actions .pill{font-weight:500}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--night);border:1px dashed var(--line-2);border-radius:var(--r);font-size:13px}
.foot{margin-top:26px;font-size:11.5px;color:var(--dim);line-height:1.6}
.grow{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:820px){.grow{grid-template-columns:1fr}}
.feed{display:flex;flex-direction:column;gap:6px;margin-bottom:28px}.feed .u{display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:baseline;padding:9px 12px;background:var(--bark,#2a241d);border:1px solid var(--line,rgba(255,255,255,.08));border-radius:9px;font-size:13px}.feed .u .w{font:600 11px var(--mono,monospace);color:var(--muted,#9a8f80)}.feed .u .a b{color:var(--straw,#c9a227)}.feed .u .who{font-size:11.5px;color:var(--muted,#9a8f80)}.feed .empty{color:var(--muted,#9a8f80);font-size:13px;padding:8px 0}.editlink{margin-left:auto;font:700 11px var(--mono,monospace);letter-spacing:.08em;text-transform:uppercase;color:var(--bark,#1c1813);background:var(--straw,#c9a227);padding:5px 10px;border-radius:999px;text-decoration:none}</style>
</head>
<body><div class="wrap">
<div class="hero"><div><div class="eyebrow" id="eb"></div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
<div class="ctl"><div class="seg" id="langs"></div></div></div>
<div class="pulse" id="pulse"></div>
<div class="stage"></div>
<div class="tiles" id="kpis"></div>
<div class="sec"><h2 id="h_fire"></h2><span class="rule"></span><span class="n" id="n_fire"></span></div><div class="tbl"><table id="t_fire"></table></div>
<div class="sec"><h2 id="h_work"></h2><span class="rule"></span><span class="n" id="n_work"></span></div><div class="tiles" id="work"></div>
<div class="sec"><h2 id="h_upd"></h2><span class="rule"></span><span class="n" id="n_upd"></span><a class="editlink" id="editlink" href="index.html#edit"></a></div><div class="feed" id="updates"></div>
<div class="grow">
  <div><div class="sec"><h2 id="h_water"></h2><span class="rule"></span></div><div class="tbl"><table id="t_water"></table></div></div>
  <div><div class="sec"><h2 id="h_hab"></h2><span class="rule"></span></div><div class="tbl"><table id="t_hab"></table></div></div>
</div>
<div class="foot" id="foot"></div>
</div>
<script src="sat-data.js"></script><script src="alerts-data.js"></script><script src="work-data.js"></script>
<script src="defensible-data.js"></script><script src="water-data.js"></script><script src="habitat-data.js"></script>
<script src="suitability-data.js"></script><script src="trees-data.js"></script>
<script>
let LANG="pt"; try{LANG=localStorage.getItem("edr_lang")||((navigator.language||"pt").toLowerCase().startsWith("pt")?"pt":"en");}catch(e){}
const T={pt:{eb:"Painel de operações · Herdade EdenRise",ttl:"O estado da terra, hoje",sub:"Satélite, LiDAR, meteorologia e trabalho — numa só página, atualizada automaticamente.",
  fire:"Fogo — espaço defensável por edifício",work:"Trabalho espelhado com o ClickUp",water:"Água — bacias e escoamento",hab:"Capital natural — ocupação do solo 2025",
  risk:"Risco de incêndio",wind:"Vento",veg:"Vigor das pastagens",moist:"Humidade da vegetação",alerts:"Alertas de vegetação",trees:"Árvores individuais",stressed:"Copas com stress",oaks:"Candidatas a sobro/azinho",canopy:"Copado",suit:"Área apta para construir",runoff:"Escoamento a 50 mm",cross:"Travessias em risco alto",
  cols:["#","Edifício","Score","Classe","Copado 30 m","Árvores altas","Declive","Água","O que fazer"],wcols:["Bacia","Área","Copado","Coef.","m³"],hcols:["Classe COS 2025","ha","%"],
  nodata:"sem dados ainda",synced:"sincronizado",latest:"última passagem",open:"abertos",done:"concluídos",nomirror:"O espelho ClickUp ainda não sincronizou — falta o token da API.",stable:"estável nas últimas 6 passagens",vs:"vs. mês anterior",
  pulse:{risk:"risco",wind:"vento",veg:"pastagens",alerts:"alertas",sync:"satélite"}},
 en:{eb:"Operations dashboard · Herdade EdenRise",ttl:"The state of the land, today",sub:"Satellite, LiDAR, weather and work — on one page, updated automatically.",
  fire:"Fire — defensible space per building",work:"Work mirrored with ClickUp",water:"Water — catchments and runoff",hab:"Natural capital — 2025 land cover",
  risk:"Fire risk",wind:"Wind",veg:"Pasture vigour",moist:"Vegetation moisture",alerts:"Vegetation alerts",trees:"Individual trees",stressed:"Stressed crowns",oaks:"Cork/holm-oak candidates",canopy:"Canopy",suit:"Build-suitable area",runoff:"Runoff at 50 mm",cross:"High-risk crossings",
  cols:["#","Building","Score","Class","Canopy 30 m","Tall trees","Slope","Water","What to do"],wcols:["Catchment","Area","Canopy","Coef.","m³"],hcols:["COS 2025 class","ha","%"],
  nodata:"no data yet",synced:"synced",latest:"latest pass",open:"open",done:"done",nomirror:"The ClickUp mirror hasn't synced yet — API token missing.",stable:"stable over the last 6 passes",vs:"vs. last month",
  pulse:{risk:"risk",wind:"wind",veg:"pastures",alerts:"alerts",sync:"satellite"}}};
const RCM={1:["Reduzido","Low","oak"],2:["Moderado","Moderate","oak"],3:["Elevado","High","straw"],4:["Muito elevado","Very high","ember"],5:["Máximo","Maximum","ember"]};
const D=typeof DEFDATA!=="undefined"?DEFDATA.defensible_space.features:[], W=typeof WATERDATA!=="undefined"?WATERDATA:null, H=typeof HABDATA!=="undefined"?HABDATA:null,
      S=typeof SATDATA!=="undefined"?SATDATA:null, A=typeof ALERTDATA!=="undefined"?ALERTDATA.alerts.filter(a=>a.status==="aberto"):[], WK=typeof WORKDATA!=="undefined"?WORKDATA:null,
      SU=typeof SUITDATA!=="undefined"?SUITDATA.suitability_zones.features:[], TR=typeof TREEDATA!=="undefined"?TREEDATA.tree_tops.features:[];
let rcm=null, wind=null;
const loc=()=>LANG==="en"?"en-GB":"pt-PT"; const fmt=n=>Number(n).toLocaleString(loc());
function pasture(){ if(!S) return null; const by={}; for(const s of Object.values(S.series)){ if(s.kind!=="pastagem") continue; for(const [d,n,m] of s.pts){ const b=by[d]=by[d]||[0,0,0]; b[0]+=n;b[1]+=m;b[2]++; } } return Object.entries(by).sort().map(([d,b])=>[d,b[0]/b[2],b[1]/b[2]]); }
function spark(vals,color){ const Wd=260,Hh=44,p=3,lo=Math.min(...vals),hi=Math.max(...vals); const x=i=>p+i*(Wd-2*p)/(vals.length-1),y=v=>Hh-p-((v-lo)/Math.max(hi-lo,.05))*(Hh-2*p); const d=vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${Wd} ${Hh}" preserveAspectRatio="none"><path d="${d} L${Wd-p},${Hh} L${p},${Hh} Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/><circle cx="${x(vals.length-1).toFixed(1)}" cy="${y(vals[vals.length-1]).toFixed(1)}" r="2.6" fill="${color}"/></svg>`; }
function tile(k,v,d,{extra="",cls=""}={}){ return `<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}</div>${extra}<div class="d">${d}</div></div>`; }
function chip(delta,unit=""){ if(delta==null) return ""; const up=delta>=0; return `<span class="chip ${up?"up":"down"}">${up?"▲":"▼"} ${Math.abs(delta).toFixed(2)}${unit}</span>`; }
function render(){
  const t=T[LANG]; document.getElementById("eb").textContent=t.eb; document.getElementById("ttl").textContent=t.ttl; document.getElementById("sub").textContent=t.sub;
  const L=document.getElementById("langs"); L.innerHTML=""; [["pt","PT"],["en","EN"]].forEach(([c,l])=>{const b=document.createElement("button");b.textContent=l;if(c===LANG)b.classList.add("on");b.onclick=()=>{LANG=c;try{localStorage.setItem("edr_lang",c);}catch(e){}render();};L.appendChild(b);});
  const ps=pasture(); const last=ps?ps[ps.length-1]:null; const prev=ps&&ps.length>8?ps[ps.length-8]:null; const dNdvi=last&&prev?last[1]-prev[1]:null;
  const stressed=TR.filter(f=>f.properties.vigour==="stressado").length, oaks=TR.filter(f=>f.properties.oak_candidate).length;
  const r=rcm?RCM[rcm]:null; const today=new Date().toISOString().slice(0,10);
  // pulse line
  document.getElementById("pulse").innerHTML=[
    `<span class="p"><span class="dot ${r?r[2]:""}"></span><span class="k">${t.pulse.risk}</span><b>${r?(LANG==="en"?r[1]:r[0]):"—"}</b></span>`,
    `<span class="p"><span class="k">${t.pulse.wind}</span><b>${wind?`${wind.card} ${Math.round(wind.spd)} km/h`:"—"}</b>${wind?`<span class="k">· ${wind.rh}% RH</span>`:""}</span>`,
    `<span class="p"><span class="k">${t.pulse.veg}</span><b>NDVI ${last?last[1].toFixed(2):"—"}</b>${chip(dNdvi)}</span>`,
    `<span class="p"><span class="dot ${A.length?"ember":""}"></span><span class="k">${t.pulse.alerts}</span><b>${A.length}</b></span>`,
    `<span class="p"><span class="k">${t.pulse.sync}</span><b class="mono">${S?S.updated:"—"}</b></span>`].join("");
  document.getElementById("kpis").innerHTML=[
    tile(t.risk, r?`<span class="pill ${r[2]}">${LANG==="en"?r[1]:r[0]}</span>`:"—", "IPMA · Odemira · "+today, {cls:r?(r[2]==="oak"?"accent":r[2]==="straw"?"warn":"danger"):""}),
    tile(t.wind, wind?`${Math.round(wind.spd)}<small>km/h ${wind.card}</small>`:"—", wind?`${LANG==="en"?"gusts":"rajadas"} ${Math.round(wind.gust)} · ${wind.rh}% · ${Math.round(wind.temp)}°`:t.nodata, {cls:"info"}),
    tile(t.veg, last?`${last[1].toFixed(2)}<small>NDVI</small>`:"—", last?`${t.latest} ${last[0]} · ${chip(dNdvi)} ${t.vs}`:t.nodata, {extra:ps?spark(ps.map(x=>x[1]),"#7f9a6a"):"",cls:"accent"}),
    tile(t.moist, last?`${last[2].toFixed(2)}<small>NDMI</small>`:"—", last?`${t.latest} ${last[0]}`:t.nodata, {extra:ps?spark(ps.map(x=>x[2]),"#6f9fc0"):"",cls:"info"}),
    tile(t.alerts, A.length, A.length?A.slice(0,2).map(a=>`${a.zone_name} ${a.metric.toUpperCase()} −${Math.abs(a.change_pct).toFixed(0)}%`).join(" · "):t.stable, {cls:A.length?"danger":"accent"}),
    tile(t.trees, fmt(TR.length), "LiDAR DGT 2024 · 50 cm"),
    tile(t.stressed, fmt(stressed), `${(100*stressed/Math.max(TR.length,1)).toFixed(0)}% · NDVI 2025 · ${LANG==="en"?"dry season, relative":"época seca, relativo"}`, {cls:"warn"}),
    tile(t.oaks, fmt(oaks), LANG==="en"?"crown shape — confirm in field":"forma da copa — confirmar no terreno"),
    tile(t.canopy, H?`${H.summary.canopy_pct_of_parcel}<small>%</small>`:"—", H?`${H.summary.canopy_ha} ha · ≈${H.summary.tree_co2e_stock_t_proxy} t CO₂e`:t.nodata, {cls:"accent"}),
    tile(t.suit, SU.length?`${(SU.reduce((a,f)=>a+f.properties.area_m2,0)/1e4).toFixed(1)}<small>ha</small>`:"—", SU.length?`${SU.length} ${LANG==="en"?"zones · best":"zonas · melhor"}: ${SU[0].properties.name} (${SU[0].properties.score})`:t.nodata),
    tile(t.runoff, W?`${fmt(W.catchments_runoff.features.reduce((a,f)=>a+f.properties.runoff_m3_50mm,0))}<small>m³</small>`:"—", W?`${W.catchments_runoff.features.length} ${LANG==="en"?"catchments":"bacias"}`:t.nodata, {cls:"info"}),
    tile(t.cross, W?W.track_crossings.features.filter(f=>f.properties.risco==="alto").length:"—", W?`${LANG==="en"?"of":"de"} ${W.track_crossings.features.length} · ${LANG==="en"?"inspect before autumn rain":"inspecionar antes das chuvas"}`:t.nodata, {cls:"warn"}),
  ].join("");
  document.getElementById("h_fire").textContent=t.fire; document.getElementById("n_fire").textContent=`${D.length} ${LANG==="en"?"buildings":"edifícios"}`;
  const cl=c=>c==="fraca"?"ember":(c==="moderada"?"straw":"oak");
  document.getElementById("t_fire").innerHTML=`<tr>${t.cols.map((c,i)=>`<th class="${[2,4,5,6,7].includes(i)?"num":""}">${c}</th>`).join("")}</tr>`+D.map(f=>{const p=f.properties;return `<tr><td class="num">${p.rank_risk}</td><td><b>${p.name}</b></td><td class="num"><span class="pill ${cl(p.classe)}">${p.score}</span></td><td>${p.classe}</td><td class="num">${p.canopy_cover_30m_pct}%</td><td class="num">${p.tall_trees_20m}</td><td class="num">${p.slope_mean_deg}°</td><td class="num">${p.dist_water_m} m</td><td><div class="actions">${p.actions.split("; ").map(a=>`<span class="pill ghost">${a}</span>`).join("")}</div></td></tr>`;}).join("");
  document.getElementById("h_work").textContent=t.work;
  const wk=document.getElementById("work");
  if(WK){ const by={}; for(const [k,w] of Object.entries(WK.items)){ const g=k.split("-")[0]; const b=by[g]=by[g]||{open:0,closed:0}; w.closed?b.closed++:b.open++; }
    document.getElementById("n_work").textContent=`${t.synced} ${String(WK.synced).slice(0,16).replace("T"," ")}`;
    const NAMES={FIRE:{pt:"Faixas de combustível",en:"Fuel strips"},INSP:{pt:"Inspeções",en:"Inspections"},PERMIT:{pt:"Licenças ICNF",en:"ICNF permits"},ALERT:{pt:"Alertas",en:"Alerts"}};
    wk.innerHTML=Object.entries(by).map(([g,b])=>tile((NAMES[g]||{pt:g,en:g})[LANG], `${b.open}<small>${t.open}</small>`, `${b.closed} ${t.done}`, {extra:`<div class="bar"><i style="width:${100*b.closed/Math.max(b.open+b.closed,1)}%"></i></div>`})).join(""); }
  else { document.getElementById("n_work").textContent=""; wk.innerHTML=`<div class="empty" style="grid-column:1/-1">${t.nomirror}</div>`; }
  document.getElementById("h_water").textContent=t.water;
  document.getElementById("t_water").innerHTML=`<tr>${t.wcols.map((c,i)=>`<th class="${i?"num":""}">${c}</th>`).join("")}</tr>`+(W?W.catchments_runoff.features.map(f=>{const p=f.properties;return `<tr><td>${p.name}</td><td class="num">${p.area_ha} ha</td><td class="num">${p.canopy_cover_pct}%</td><td class="num">${p.runoff_coef}</td><td class="num">${fmt(p.runoff_m3_50mm)}</td></tr>`;}).join(""):"");
  document.getElementById("h_hab").textContent=t.hab;
  const tot=H?Object.values(H.summary.cos2025_classes_ha).reduce((a,b)=>a+b,0):1;
  document.getElementById("t_hab").innerHTML=`<tr>${t.hcols.map((c,i)=>`<th class="${i?"num":""}">${c}</th>`).join("")}</tr>`+(H?Object.entries(H.summary.cos2025_classes_ha).filter(([k,v])=>v>=0.05).map(([k,v])=>`<tr><td>${k}<div class="bar"><i style="width:${100*v/tot}%"></i></div></td><td class="num">${v}</td><td class="num">${(100*v/tot).toFixed(1)}%</td></tr>`).join(""):"");
  document.getElementById("foot").textContent=(LANG==="en"?"Sources: Sentinel-2 via Earth Search · IPMA · EFFIS · Open-Meteo · DGT LiDAR 2024 & ORTOS-2025 · COS 2025 · ops.gpkg. Every figure is a model output on real data — use for ranking and attention, verify in the field before spending.":"Fontes: Sentinel-2 via Earth Search · IPMA · EFFIS · Open-Meteo · LiDAR DGT 2024 & ORTOS-2025 · COS 2025 · ops.gpkg. Cada número é um modelo sobre dados reais — serve para ordenar e dar atenção; confirmar no terreno antes de gastar.");
}
render();
fetch("https://api.ipma.pt/open-data/forecast/meteorology/rcm/rcm-d0.json").then(r=>r.json()).then(d=>{rcm=d.local&&d.local["0211"]?d.local["0211"].data.rcm:null;render();}).catch(()=>{});
fetch("https://api.open-meteo.com/v1/forecast?latitude=37.512&longitude=-8.645&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m,relative_humidity_2m&timezone=Europe%2FLisbon").then(r=>r.json()).then(w=>{const c=w.current; const dirs=LANG==="en"?["N","NE","E","SE","S","SW","W","NW"]:["N","NE","E","SE","S","SO","O","NO"]; wind={spd:c.wind_speed_10m,gust:c.wind_gusts_10m,rh:c.relative_humidity_2m,temp:c.temperature_2m,card:dirs[Math.round(c.wind_direction_10m/45)%8]}; render();}).catch(()=>{});
</script>
<script src="nav.js"></script>
<script>
(function(){ const EN=(typeof LANG!=="undefined"&&LANG==="en"); const API="https://edenrise-brain.edenrise.workers.dev";
 document.getElementById("h_upd").textContent=EN?"Map edits & updates":"Edições e atualizações do mapa"; document.getElementById("editlink").textContent=EN?"Open edit mode →":"Abrir modo edição →";
 const V=EN?{"feature.add":"added","feature.modify":"proposed a change to","feature.retire":"proposed retiring","feature.update":"updated","feature.status":"set status of","feature.create":"placed","changeset.open":"opened an edit round","learn":"taught the brain"}:{"feature.add":"adicionou","feature.modify":"propôs alterar","feature.retire":"propôs retirar","feature.update":"atualizou","feature.status":"mudou o estado de","feature.create":"colocou","changeset.open":"abriu uma ronda de edições","learn":"ensinou o cérebro"};
 fetch(API+"/updates?limit=25").then(r=>r.json()).then(d=>{ const el=document.getElementById("updates"); const c=d.counts||{}; document.getElementById("n_upd").textContent=(c.proposto||0)+" "+(EN?"pending":"pendentes")+" · "+(c.aprovado||0)+" "+(EN?"approved":"aprovadas");
   if(!d.updates||!d.updates.length){ el.innerHTML=`<div class="empty">${d.d1===false?(EN?"Update log unavailable right now.":"Registo indisponível de momento."):(EN?"No edits yet — open the map in edit mode to add or change items.":"Ainda sem edições — abra o mapa em modo edição para adicionar ou alterar itens.")}</div>`; return; }
   el.innerHTML=d.updates.map(u=>{ const p=u.payload||{}; const what=(p.name||u.target||"").toString(); const where=(p.lat&&p.lon)?`<a href="index.html#v=${p.lat},${p.lon},19" style="color:var(--straw,#c9a227)">${EN?"map":"mapa"} ↗</a>`:""; return `<div class="u"><span class="w">${String(u.at).slice(0,16).replace("T"," ")}</span><span class="a"><b>${u.actor||"—"}</b> ${V[u.action]||u.action} <b>${what}</b>${p.status?` → ${p.status}`:""}${p.ref_id?` <span class="who">(${p.ref_id})</span>`:""}</span><span class="who">${u.role||""} ${where}</span></div>`; }).join(""); }).catch(()=>{ document.getElementById("updates").innerHTML=`<div class="empty">—</div>`; });
})();
</script>
</body></html>

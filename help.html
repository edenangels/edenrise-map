<style>
body{background:var(--night);color:var(--linen);font:15px/1.55 var(--ui);margin:0} .pg{max-width:860px;margin:0 auto;padding:26px 20px 80px}
h1{font:600 30px var(--display);letter-spacing:-.01em;margin:6px 0 4px} .eyebrow{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)} .lede{color:var(--linen-2);max-width:64ch}
h2{font:600 20px var(--display);margin:34px 0 8px} .sec{display:grid;grid-template-columns:1fr 1fr;gap:10px} .box{background:var(--bark);border:1px solid var(--line);border-radius:12px;padding:14px 16px} .box h3{font:600 14px var(--display);margin:0 0 6px} .box p,.box li{color:var(--linen-2);font-size:14px;margin:0} .box ul{margin:0;padding-left:18px} kbd{font:600 11px var(--mono);background:var(--night-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--linen)}
.tabs{display:flex;gap:6px;margin-bottom:10px} .tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--linen);font:600 12px var(--ui);cursor:pointer} .tabs button.on{background:var(--straw);color:var(--bark);border-color:var(--straw)} .tabs button:focus-visible{outline:2px solid var(--straw);outline-offset:2px}
a{color:var(--straw)} .btn{display:inline-block;padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--night-2);color:var(--linen);font:700 12px var(--ui);text-decoration:none;margin:4px 6px 0 0} .btn:focus-visible{outline:2px solid var(--straw);outline-offset:2px}
.sec{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .box p,.box li,.box h3{overflow-wrap:anywhere} .box{min-width:0}
@media(max-width:700px){.sec{grid-template-columns:minmax(0,1fr)} .pg{padding:18px 12px 60px} [style*="grid-template-columns"]{grid-template-columns:1fr!important}}
</style></head><body>

<script>
const EN=(localStorage.getItem("edr_lang")||"pt")==="en"; document.documentElement.lang=EN?"en":"pt";
const C=EN?{eyebrow:"EdenRise · help",h1:"How the estate map works",lede:"One map for the whole team: what exists, what is proposed, what needs doing, and proof for the authorities. Works on phone, iPad and computer, online and offline.",tour:"Replay the guided tour",map:"Open the map",
 sections:[["Getting in",[["Two keys","Field key: add items, propose changes, report, add photos and notes, tasks. Leadership key: everything, plus approve, reject, delete and register sensors. Tap EDIT or the profile pill in the Brain to sign in; the device remembers you."],["Install on iPad or phone","Safari → Share → Add to Home Screen. Then tap “save offline” in the layer tools before going where there is no signal."]]],
 ["Editing",[["Draw","P point, L line, A area, R rectangle, C circle. Tap the first point to close an area, the last point to end a line. Backspace removes the last point."],["Exact shapes","F: choose the shape, type real sizes in m or cm, rotation, grid. Point 1 anchors, point 2 orients."],["Live numbers","Every segment shows its length while you draw; areas show m²; lines show elevation and slope from the LiDAR. Type a number and Enter to place the next point at that distance."],["Rotate, cut, merge, split","Green ball = rotate (Shift 15° steps). Cortar removes a drawn area from an item; Unir joins two areas; Dividir splits a line."],["Cancel never deletes","A new drawing stays as a draft; a saved item reverts. Only Apagar deletes, always with confirmation, and everything is recoverable under ↶ Recuperar."]]],
 ["Photos, notes, tasks",[["3D room","Item card → 🧊 3D. Scan the room once with a free phone app (Scaniverse → export SPZ is best; Polycam or 3D Scanner App → GLB; Apple RoomPlan → USDZ) and upload the file. Then 📍 Add pin, tap the spot, pick the item that is there. Each pin shows that item's state and gives Service / Part / Problem / Reading in one tap. Save makes a new version; Versions brings back any earlier set of pins; Delete always asks first."],["Labels on the stickers","Open the camera inside a room: every QR sticker in view gets the item's name and state written on it, coloured red for an open problem, orange for parts on order, green when serviced. Tap the label to open the card. Works without GPS. In the Android app the label stays on the sticker as you move."],["Labels inside a place","Zoom into a building or zone (level 19 and closer), or stand inside it with GPS on, and the things inside get labels with their state. Labels that do not fit become dots; the place's tag shows how many (+N) and opens its 3D room when there is one. 🏷 at the top right turns them off."],["Tags (NFC and QR)","Item card → 🏷 Tag. Write an NFC sticker from Chrome on Android (lock it if you want it read-only), or print a QR sticker — one item or every item in a building. Stick it on the equipment: touching the NFC sticker or pointing any phone camera at the QR opens that item's card, on Android and iPhone, even without signal. Service done, part ordered, problem and reading are saved on the device and sent when signal returns."],["Board (Quadro)","Every item has an interactive board: draw the pump room with valves and pipes, a building plan, a paddock — straight lines, shapes, arrows, text, sticky notes, photos, the estate symbol library, a 1 m grid and the real aerial photo underneath at true scale. Templates to start; link any shape to another item; every save is a version you can go back to; works on tablet and phone, offline too. Mapa: bring the GIS around the item onto the board at true scale, or send what you drew to the map as proposals at metre accuracy. Medir: tape measure, size and area labels, scale a photo from one known distance. Valves, pumps, tanks and meters are smart symbols: tap one to set its tag, state or reading."],["On any item","Photos (camera), files, voice notes and a notes timeline live in every item’s card — team items and the original layers alike."],["Tasks","✔ TAREFAS: work pinned to a place with assignee, due date, priority; mark done with a photo; share on WhatsApp."],["Fire strips","Tap a strip → Registar limpeza → date, who, before/after photos. The compliance page prints the proof for 31 May."]]],
 ["Reviewing",[["Proposals","Everything the team adds is a proposal (dashed) until leadership approves it in the Rever panel; QGIS receives every item in the ops GeoPackage every 15 minutes."],["History","Any item: Histórico → see any previous version on the map and restore it with one tap."],["Conflicts","If two people edited the same item, you choose field by field which version stays."]]],
 ["In the field",[["Camera view (Ver)","GPS → camera: the map's items float over the live camera at their real place and height, with distance; tap one for its card. Point the ring at the ground and Marcar files what you see as a proposal with a photo of that instant. Ponto / Linha / Área: mark a line or an area point by point. Labels spread out on their own; far ones become dots."],["AR+","On Android Chrome the AR+ button switches on world tracking: the phone knows its own motion, labels stay nailed to the real places as you walk, and marks land on the real ground. Walk a few metres first so it locks to the GPS."],["RTK receiver","Tap RTK in the survey sheet or the camera view to connect a u-blox / ArduSimple / Emlid receiver over Bluetooth: centimetre positions everywhere the map uses your position. On iPhone open the map in the Bluefy browser for this."],["Several at once","Vários: drag a box around items, then set colour or type, approve or reject, or retire them together. Colours: every item can have its own from the palette; the type list shows every type and lets you write your own."],["Area and route tasks","New task → Point, Area or Route. For an area or route, tap the map to place points (↶ removes the last, drag still moves the map), then Finish. Several people: separate names with commas — the task appears in each person's Mine list. The shape is drawn on the map with its size."],["Messages, check-in, SOS","Team panel → Messages. Write to the team; @Name calls someone in. Leaders can post an announcement that everyone confirms — the list shows who confirmed and who is still missing. ⏳ means waiting on this device, ✓ on the server, ✓✓ confirmed. Check-in: tap ✅ and choose the interval; if your next check-in is more than 10 minutes late while on duty, the whole team sees ⏰. SOS sends your position to everyone and stays on their screen until someone answers. Shift handover drafts a summary of what was done, opened, overdue and reported — add notes and post."],["Team","Tap the team counter in the top bar. Choose on duty, on a break or off duty, and whether to share your position while on duty. Teammates who share appear where their GPS puts them, with the accuracy as a ring and the age of the fix: live, minutes ago, or a grey last-seen. Tap a person to assign them a task where they are, walk there, see their current task, or message them. People only viewing the map are listed, never placed."],["Mine","The Meus button lists what you marked with its status, and tells you when a leader approves, rejects or comments."],["The app","EdenRise Campo (Android now, iPhone soon) is the same map with the phone's own AR engine and offline tiles — ask for the installer."]]],
 ["Asking",[["Estate Brain","Ask in Portuguese or English: “which buildings are most exposed to fire?”, “any news on the septic tank?”, “put a water tank here”. Answers cite the items used."],["Live","Signed-in teammates appear as cursors; you see what they are drawing in real time."]]]]}
:{eyebrow:"EdenRise · ajuda",h1:"Como funciona o mapa da herdade",lede:"Um mapa para toda a equipa: o que existe, o que está proposto, o que é preciso fazer e a prova para as autoridades. Funciona no telemóvel, iPad e computador, com e sem rede.",tour:"Repetir a visita guiada",map:"Abrir o mapa",
 sections:[["Entrar",[["Duas chaves","Chave de terreno: adicionar itens, propor alterações, reportar, juntar fotos e notas, tarefas. Chave de liderança: tudo, mais aprovar, rejeitar, apagar e registar sensores. Toque em EDITAR ou no selo de perfil do Cérebro para entrar; o aparelho lembra-se."],["Instalar no iPad ou telemóvel","Safari → Partilhar → Adicionar ao ecrã principal. Depois toque em “guardar offline” nas ferramentas das camadas antes de ir para onde não há rede."]]],
 ["Editar",[["Desenhar","P ponto, L linha, A área, R retângulo, C círculo. Toque no primeiro ponto para fechar uma área, no último para terminar uma linha. Backspace remove o último ponto."],["Formas exatas","F: escolha a forma, escreva as medidas reais em m ou cm, rotação, grelha. O ponto 1 ancora, o ponto 2 orienta."],["Números ao vivo","Cada segmento mostra o comprimento enquanto desenha; áreas mostram m²; linhas mostram cota e declive do LiDAR. Escreva um número e Enter para colocar o próximo ponto a essa distância."],["Rodar, cortar, unir, dividir","Bola verde = rodar (Shift em passos de 15°). Cortar retira uma área desenhada de um item; Unir junta duas áreas; Dividir divide uma linha."],["Cancelar nunca apaga","Um desenho novo fica como rascunho; um item guardado volta ao que estava. Só Apagar apaga, sempre com confirmação, e tudo é recuperável em ↶ Recuperar."]]],
 ["Fotos, notas, tarefas",[["Sala 3D","Ficha do item → 🧊 3D. Digitalize a sala uma vez com uma app grátis (Scaniverse → exportar SPZ é o melhor; Polycam ou 3D Scanner App → GLB; Apple RoomPlan → USDZ) e carregue o ficheiro. Depois 📍 Juntar pino, toque no sítio e escolha o item que lá está. Cada pino mostra o estado do item e dá Serviço / Peça / Problema / Leitura num toque. Guardar cria uma versão nova; Versões recupera qualquer conjunto anterior; Apagar pergunta sempre."],["Etiquetas nas etiquetas QR","Abra a câmara dentro de uma sala: cada etiqueta QR à vista recebe o nome e o estado do item, a vermelho com problema aberto, laranja com peças encomendadas, verde com serviço feito. Toque para abrir a ficha. Funciona sem GPS. Na app Android a etiqueta fica presa ao autocolante enquanto se move."],["Etiquetas dentro de um sítio","Aproxime-se de um edifício ou zona (nível 19 ou mais), ou esteja lá dentro com o GPS ligado, e o que está lá dentro ganha etiquetas com o estado. As que não cabem ficam pontos; a etiqueta do sítio diz quantas (+N) e abre a sala 3D quando existe. 🏷 no canto superior direito desliga-as."],["Etiquetas (NFC e QR)","Ficha do item → 🏷 Etiqueta. Escreva uma etiqueta NFC no Chrome do Android (pode bloqueá-la só de leitura) ou imprima uma etiqueta QR — de um item ou de todos os itens de um edifício. Cole no equipamento: encostar o telemóvel ao NFC ou apontar qualquer câmara ao QR abre a ficha do item, no Android e no iPhone, mesmo sem rede. Serviço feito, peça encomendada, problema e leitura ficam no aparelho e são enviados quando houver rede."],["Quadro","Cada item tem um quadro interativo: desenhe a casa das bombas com válvulas e condutas, a planta de um edifício, um parque — linhas retas, formas, setas, texto, notas, fotos, a biblioteca de símbolos da herdade, grelha de 1 m e a foto aérea real por baixo à escala. Modelos para começar; ligue qualquer forma a outro item; cada gravação é uma versão a que pode voltar; funciona no tablet e no telemóvel, também sem rede. Mapa: traga o GIS à volta do item para o quadro à escala, ou envie o que desenhou para o mapa como propostas ao metro. Medir: fita métrica, etiquetas de medida e área, escala de uma foto a partir de uma distância conhecida. Válvulas, bombas, depósitos e contadores são símbolos inteligentes: toque num para definir tag, estado ou leitura."],["Em qualquer item","Fotos (câmara), ficheiros, notas de voz e uma linha de tempo de notas vivem na ficha de cada item — itens da equipa e camadas originais."],["Tarefas","✔ TAREFAS: trabalho preso a um sítio com responsável, prazo, prioridade; marcar feita com foto; partilhar no WhatsApp."],["Faixas de combustível","Toque numa faixa → Registar limpeza → data, quem, fotos antes/depois. A página de conformidade imprime a prova para 31 de maio."]]],
 ["Rever",[["Propostas","Tudo o que a equipa adiciona é uma proposta (tracejado) até a liderança aprovar no painel Rever; o QGIS recebe todos os itens no GeoPackage de operações a cada 15 minutos."],["Histórico","Em qualquer item: Histórico → ver qualquer versão anterior no mapa e repô-la com um toque."],["Conflitos","Se duas pessoas editaram o mesmo item, escolhe campo a campo que versão fica."]]],
 ["No campo",[["Ver com a câmara","GPS → câmara: os itens do mapa flutuam sobre a imagem no sítio e altura reais, com a distância; toque num para a ficha. Aponte o anel ao chão e Marcar regista o que vê como proposta, com uma foto desse instante. Ponto / Linha / Área: marque uma linha ou uma área ponto a ponto. As etiquetas espalham-se sozinhas; as longínquas ficam pontos."],["AR+","No Chrome do Android o botão AR+ liga o tracking do mundo: o telemóvel conhece o próprio movimento, as etiquetas ficam presas aos sítios reais enquanto anda e as marcações caem no chão real. Ande uns metros primeiro para se prender ao GPS."],["Recetor RTK","Toque em RTK na folha de levantamento ou na câmara para ligar um recetor u-blox / ArduSimple / Emlid por Bluetooth: posições ao centímetro em tudo o que usa a sua posição. No iPhone abra o mapa no browser Bluefy para isto."],["Vários de uma vez","Vários: arraste uma caixa à volta dos itens e mude cor ou tipo, aprove ou rejeite, ou retire-os em conjunto. Cores: cada item pode ter a sua, da paleta; a lista de tipos mostra todos e deixa escrever o seu."],["Tarefas em área e percurso","Nova tarefa → Ponto, Área ou Percurso. Numa área ou percurso, toque no mapa para pôr pontos (↶ tira o último, arrastar continua a mover o mapa) e depois Terminar. Várias pessoas: separe os nomes com vírgulas — a tarefa aparece nas Minhas de cada um. A forma fica desenhada no mapa com o tamanho."],["Mensagens, check-in, SOS","Painel da equipa → Mensagens. Escreva para a equipa; @Nome chama alguém. A liderança pode publicar um aviso que todos confirmam — a lista mostra quem confirmou e quem falta. ⏳ é à espera neste aparelho, ✓ no servidor, ✓✓ confirmado. Check-in: toque em ✅ e escolha o intervalo; se o próximo check-in passar 10 minutos em serviço, toda a equipa vê ⏰. O SOS envia a sua posição a todos e fica no ecrã deles até alguém responder. A passagem de turno prepara um resumo do que foi feito, aberto, em atraso e reportado — acrescente notas e publique."],["Equipa","Toque no contador da equipa na barra de cima. Escolha em serviço, em pausa ou fora de serviço, e se partilha a posição em serviço. Quem partilha aparece onde o GPS o põe, com a precisão em anel e a idade da posição: ao vivo, há minutos, ou cinzento visto pela última vez. Toque numa pessoa para lhe atribuir uma tarefa onde está, ir até lá, ver a tarefa em curso ou enviar mensagem. Quem só está a ver o mapa aparece na lista, nunca no mapa."],["Os meus","O botão Meus lista o que marcou com o estado, e avisa quando a liderança aprova, rejeita ou comenta."],["A app","EdenRise Campo (Android já, iPhone em breve) é o mesmo mapa com o motor de AR do próprio telemóvel e mapas offline — peça o instalador."]]],
 ["Perguntar",[["Cérebro da Herdade","Pergunte em português ou inglês: “que edifícios estão mais expostos ao fogo?”, “há novidades sobre a fossa?”, “põe um tanque aqui”. As respostas citam os itens usados."],["Ao vivo","Colegas com sessão iniciada aparecem como cursores; vê o que estão a desenhar em tempo real."]]]]};
const pg=document.getElementById("pg"); pg.innerHTML=`<div class="eyebrow">${C.eyebrow}</div><h1>${C.h1}</h1><p class="lede">${C.lede}</p><a class="btn" href="index.html">${C.map} →</a><a class="btn" href="index.html#tour">▶ ${C.tour}</a>`+C.sections.map(([h,items])=>`<h2>${h}</h2><div class="sec">${items.map(([t,d])=>`<div class="box"><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>`).join("")+`<h2>${EN?"Keyboard":"Teclado"}</h2><div class="box"><p><kbd>P</kbd> <kbd>L</kbd> <kbd>A</kbd> <kbd>R</kbd> <kbd>C</kbd> ${EN?"tools":"ferramentas"} · <kbd>F</kbd> ${EN?"exact shapes":"formas exatas"} · <kbd>M</kbd> ${EN?"measure":"medir"} · <kbd>Esc</kbd> ${EN?"cancel":"cancelar"} · <kbd>Enter</kbd> ${EN?"finish":"terminar"} · <kbd>⌘Z</kbd>/<kbd>⇧⌘Z</kbd> ${EN?"undo/redo":"anular/refazer"} · <kbd>←↑→↓</kbd> ${EN?"nudge":"deslocar"} · <kbd>Shift</kbd> ${EN?"angle lock":"ângulo fixo"} · <kbd>Delete</kbd> ${EN?"delete":"apagar"}</p></div>`;
</script></body></html>

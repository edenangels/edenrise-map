<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EdenRise — Ajuda</title>
<link rel="stylesheet" href="ui.css?v=b9f22cc2">
<style>
body{background:var(--night);color:var(--linen);font:15px/1.55 var(--ui);margin:0} .pg{max-width:860px;margin:0 auto;padding:26px 20px 80px}
h1{font:600 30px var(--display);letter-spacing:-.01em;margin:6px 0 4px} .eyebrow{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)} .lede{color:var(--linen-2);max-width:64ch}
h2{font:600 20px var(--display);margin:34px 0 8px} .sec{display:grid;grid-template-columns:1fr 1fr;gap:10px} .box{background:var(--bark);border:1px solid var(--line);border-radius:12px;padding:14px 16px} .box h3{font:600 14px var(--display);margin:0 0 6px} .box p,.box li{color:var(--linen-2);font-size:14px;margin:0} .box ul{margin:0;padding-left:18px} kbd{font:600 11px var(--mono);background:var(--night-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--linen)}
.tabs{display:flex;gap:6px;margin-bottom:10px} .tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--linen);font:600 12px var(--ui);cursor:pointer} .tabs button.on{background:var(--straw);color:var(--bark);border-color:var(--straw)} .tabs button:focus-visible{outline:2px solid var(--straw);outline-offset:2px}
a{color:var(--straw)} .btn{display:inline-block;padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--night-2);color:var(--linen);font:700 12px var(--ui);text-decoration:none;margin:4px 6px 0 0} .btn:focus-visible{outline:2px solid var(--straw);outline-offset:2px}
.sec{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .box p,.box li,.box h3{overflow-wrap:anywhere} .box{min-width:0}
@media(max-width:700px){.sec{grid-template-columns:minmax(0,1fr)} .pg{padding:18px 12px 60px} [style*="grid-template-columns"]{grid-template-columns:1fr!important}}
</style></head><body>
<main class="pg" id="pg"></main>
<script src="sites.js?v=39b9c807"></script><script src="nav.js?v=9495da2c"></script>
<script>
const EN=(localStorage.getItem("edr_lang")||"pt")==="en"; document.documentElement.lang=EN?"en":"pt";
const C=EN?{eyebrow:"EdenRise · help",h1:"How the estate map works",lede:"One map for the whole team: what exists, what is proposed, what needs doing, and proof for the authorities. Works on phone, iPad and computer, online and offline.",tour:"Replay the guided tour",map:"Open the map",
 sections:[["Getting in",[["Two keys","Field key: add items, propose changes, report, add photos and notes, tasks. Leadership key: everything, plus approve, reject, delete and register sensors. Tap EDIT or the profile pill in the Brain to sign in; the device remembers you."],["Install on iPad or phone","Safari → Share → Add to Home Screen. Then tap “save offline” in the layer tools before going where there is no signal."]]],
 ["Editing",[["Draw","P point, L line, A area, R rectangle, C circle. Tap the first point to close an area, the last point to end a line. Backspace removes the last point."],["Exact shapes","F: choose the shape, type real sizes in m or cm, rotation, grid. Point 1 anchors, point 2 orients."],["Live numbers","Every segment shows its length while you draw; areas show m²; lines show elevation and slope from the LiDAR. Type a number and Enter to place the next point at that distance."],["Rotate, cut, merge, split","Green ball = rotate (Shift 15° steps). Cortar removes a drawn area from an item; Unir joins two areas; Dividir splits a line."],["Cancel never deletes","A new drawing stays as a draft; a saved item reverts. Only Apagar deletes, always with confirmation, and everything is recoverable under ↶ Recuperar."]]],
 ["Photos, notes, tasks",[["On any item","Photos (camera), files, voice notes and a notes timeline live in every item’s card — team items and the original layers alike."],["Tasks","✔ TAREFAS: work pinned to a place with assignee, due date, priority; mark done with a photo; share on WhatsApp."],["Fire strips","Tap a strip → Registar limpeza → date, who, before/after photos. The compliance page prints the proof for 31 May."]]],
 ["Reviewing",[["Proposals","Everything the team adds is a proposal (dashed) until leadership approves it in the Rever panel; QGIS receives every item in the ops GeoPackage every 15 minutes."],["History","Any item: Histórico → see any previous version on the map and restore it with one tap."],["Conflicts","If two people edited the same item, you choose field by field which version stays."]]],
 ["Asking",[["Estate Brain","Ask in Portuguese or English: “which buildings are most exposed to fire?”, “any news on the septic tank?”, “put a water tank here”. Answers cite the items used."],["Live","Signed-in teammates appear as cursors; you see what they are drawing in real time."]]]]}
:{eyebrow:"EdenRise · ajuda",h1:"Como funciona o mapa da herdade",lede:"Um mapa para toda a equipa: o que existe, o que está proposto, o que é preciso fazer e a prova para as autoridades. Funciona no telemóvel, iPad e computador, com e sem rede.",tour:"Repetir a visita guiada",map:"Abrir o mapa",
 sections:[["Entrar",[["Duas chaves","Chave de terreno: adicionar itens, propor alterações, reportar, juntar fotos e notas, tarefas. Chave de liderança: tudo, mais aprovar, rejeitar, apagar e registar sensores. Toque em EDITAR ou no selo de perfil do Cérebro para entrar; o aparelho lembra-se."],["Instalar no iPad ou telemóvel","Safari → Partilhar → Adicionar ao ecrã principal. Depois toque em “guardar offline” nas ferramentas das camadas antes de ir para onde não há rede."]]],
 ["Editar",[["Desenhar","P ponto, L linha, A área, R retângulo, C círculo. Toque no primeiro ponto para fechar uma área, no último para terminar uma linha. Backspace remove o último ponto."],["Formas exatas","F: escolha a forma, escreva as medidas reais em m ou cm, rotação, grelha. O ponto 1 ancora, o ponto 2 orienta."],["Números ao vivo","Cada segmento mostra o comprimento enquanto desenha; áreas mostram m²; linhas mostram cota e declive do LiDAR. Escreva um número e Enter para colocar o próximo ponto a essa distância."],["Rodar, cortar, unir, dividir","Bola verde = rodar (Shift em passos de 15°). Cortar retira uma área desenhada de um item; Unir junta duas áreas; Dividir divide uma linha."],["Cancelar nunca apaga","Um desenho novo fica como rascunho; um item guardado volta ao que estava. Só Apagar apaga, sempre com confirmação, e tudo é recuperável em ↶ Recuperar."]]],
 ["Fotos, notas, tarefas",[["Em qualquer item","Fotos (câmara), ficheiros, notas de voz e uma linha de tempo de notas vivem na ficha de cada item — itens da equipa e camadas originais."],["Tarefas","✔ TAREFAS: trabalho preso a um sítio com responsável, prazo, prioridade; marcar feita com foto; partilhar no WhatsApp."],["Faixas de combustível","Toque numa faixa → Registar limpeza → data, quem, fotos antes/depois. A página de conformidade imprime a prova para 31 de maio."]]],
 ["Rever",[["Propostas","Tudo o que a equipa adiciona é uma proposta (tracejado) até a liderança aprovar no painel Rever; o QGIS recebe todos os itens no GeoPackage de operações a cada 15 minutos."],["Histórico","Em qualquer item: Histórico → ver qualquer versão anterior no mapa e repô-la com um toque."],["Conflitos","Se duas pessoas editaram o mesmo item, escolhe campo a campo que versão fica."]]],
 ["Perguntar",[["Cérebro da Herdade","Pergunte em português ou inglês: “que edifícios estão mais expostos ao fogo?”, “há novidades sobre a fossa?”, “põe um tanque aqui”. As respostas citam os itens usados."],["Ao vivo","Colegas com sessão iniciada aparecem como cursores; vê o que estão a desenhar em tempo real."]]]]};
const pg=document.getElementById("pg"); pg.innerHTML=`<div class="eyebrow">${C.eyebrow}</div><h1>${C.h1}</h1><p class="lede">${C.lede}</p><a class="btn" href="index.html">${C.map} →</a><a class="btn" href="index.html#tour">▶ ${C.tour}</a>`+C.sections.map(([h,items])=>`<h2>${h}</h2><div class="sec">${items.map(([t,d])=>`<div class="box"><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>`).join("")+`<h2>${EN?"Keyboard":"Teclado"}</h2><div class="box"><p><kbd>P</kbd> <kbd>L</kbd> <kbd>A</kbd> <kbd>R</kbd> <kbd>C</kbd> ${EN?"tools":"ferramentas"} · <kbd>F</kbd> ${EN?"exact shapes":"formas exatas"} · <kbd>M</kbd> ${EN?"measure":"medir"} · <kbd>Esc</kbd> ${EN?"cancel":"cancelar"} · <kbd>Enter</kbd> ${EN?"finish":"terminar"} · <kbd>⌘Z</kbd>/<kbd>⇧⌘Z</kbd> ${EN?"undo/redo":"anular/refazer"} · <kbd>←↑→↓</kbd> ${EN?"nudge":"deslocar"} · <kbd>Shift</kbd> ${EN?"angle lock":"ângulo fixo"} · <kbd>Delete</kbd> ${EN?"delete":"apagar"}</p></div>`;
</script></body></html>

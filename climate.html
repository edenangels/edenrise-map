<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdenRise — Clima & balanço hídrico</title>
<link rel="stylesheet" href="ui.css?v=b9f22cc2">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:64px 18px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px} #top{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))} @media(max-width:700px){ .wrap{padding:58px 12px 30px} .big{font-size:22px} .card{padding:12px} .grid{gap:10px} }
.card{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font:600 13px var(--ui);letter-spacing:.02em;margin:0 0 8px;color:var(--linen)} .card .k{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font:600 28px var(--display);color:var(--linen);letter-spacing:-.01em} .big small{font:500 12px var(--ui);color:var(--muted);margin-left:6px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px} .stat:first-of-type{border-top:0} .stat b{font-family:var(--mono);font-weight:600}
svg text{font:600 10px var(--mono);fill:var(--muted)} .note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
.pos{fill:#5b8fb9} .neg{fill:#e07b39} .et{stroke:#ffd166;fill:none;stroke-width:2} .pp{fill:#5b8fb9}
.warn{border-color:rgba(224,123,57,.6)} .ok{border-color:rgba(127,154,106,.6)}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div><div class="eyebrow" id="eb"></div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div></div>
<div class="grid" id="top"></div>
<div class="grid">
  <div class="card" style="grid-column:1/-1"><h2 id="h-bal"></h2><svg id="bal" width="100%"></svg><div class="note" id="n-bal"></div></div>
  <div class="card"><h2 id="h-temp"></h2><svg id="temp" viewBox="0 0 440 200" width="100%"></svg></div>
  <div class="card"><h2 id="h-frost"></h2><svg id="frost" viewBox="0 0 440 200" width="100%"></svg></div>
  <div class="card"><h2 id="h-rose"></h2><div style="display:flex;gap:8px;justify-content:space-around;flex-wrap:wrap"><svg id="rose-summer" viewBox="0 0 200 220" style="width:min(45%,220px);min-width:150px"></svg><svg id="rose-winter" viewBox="0 0 200 220" style="width:min(45%,220px);min-width:150px"></svg></div><div class="note" id="n-rose"></div></div>
  <div class="card"><h2 id="h-years"></h2><svg id="years" viewBox="0 0 440 200" width="100%"></svg></div>
  <div class="card" style="grid-column:1/-1" id="budget"><h2 id="h-bud"></h2><div id="bud"></div><div class="note" id="n-bud"></div></div>
</div>
</div>
<script src="nav.js?v=d1e8fea3"></script>
<script>
let LANG="pt"; try{ LANG=localStorage.getItem("edr_lang")||((navigator.language||"pt").toLowerCase().startsWith("pt")?"pt":"en"); }catch(e){}
const EN=LANG==="en"; const T=EN?{eb:"Estate · Odemira",ttl:"Climate & water balance",sub:"30-year normals at the estate, the summer deficit, and what the candidate dams could hold",
 p:"Rain per year",et:"Evapotranspiration (ET0)",def:"Summer deficit",dry:"Longest dry spell",bal:"Monthly rain vs evapotranspiration — the blue is the only water the land receives; the orange is what the sky takes back",
 temp:"Temperatures (monthly mean of daily max / min)",frost:"Frost days and days over 35 °C per month",rose:"Wind roses — summer (left) and winter (right), share of days by direction",years:"Rain by year, 1991–2020",
 bud:"Estate water budget",nbal:"Rain minus ET0 by month (mm). Storage must carry the land through the months below zero.",nrose:"Summer afternoons are NW (nortada). The hot E/NE levante is rare but drives the worst fire days.",
 rain:"Rain falling on the estate in a normal year",harv:"Harvestable runoff (coefficient 0.18)",dam3:"Storage of the 3 best candidate dams",dam10:"Storage of the 10 best candidate dams",need:"Summer ET0 need, 1 ha of irrigated pasture (Jun–Sep, Kc 0.6)",
 verdict1:"The 10 best sites together would hold more than a normal year's harvestable runoff: they would not all fill. Build few, high in the catchments, and let each fill before adding the next.",verdict2:"Candidate storage is below the harvestable runoff: there is room for more retention.",
 src:"Source: Open-Meteo archive (ERA5-Land reanalysis, ~9 km grid), 1991–2020. Reanalysis rain on this coast runs below the IPMA station normals (Odemira ≈ 600 mm), so treat totals as conservative. Frost is a grid average: the frost-pocket layer on the map is the local truth.",days:"days",mm:"mm"}
 :{eb:"Herdade · Odemira",ttl:"Clima & balanço hídrico",sub:"Normais de 30 anos na herdade, o défice de verão e o que as barragens candidatas poderiam reter",
 p:"Chuva por ano",et:"Evapotranspiração (ET0)",def:"Défice de verão",dry:"Maior período seco",bal:"Chuva mensal vs evapotranspiração — o azul é a única água que a terra recebe; o laranja é o que o céu leva de volta",
 temp:"Temperaturas (média mensal das máximas / mínimas)",frost:"Dias de geada e dias acima de 35 °C por mês",rose:"Rosas dos ventos — verão (esq.) e inverno (dir.), % de dias por direção",years:"Chuva por ano, 1991–2020",
 bud:"Balanço hídrico da herdade",nbal:"Chuva menos ET0 por mês (mm). O armazenamento tem de levar a terra pelos meses abaixo de zero.",nrose:"As tardes de verão são de NO (nortada). O levante quente de E/NE é raro mas faz os piores dias de fogo.",
 rain:"Chuva que cai na herdade num ano normal",harv:"Escoamento aproveitável (coeficiente 0,18)",dam3:"Armazenamento das 3 melhores barragens candidatas",dam10:"Armazenamento das 10 melhores barragens candidatas",need:"Necessidade ET0 de verão, 1 ha de pastagem regada (jun–set, Kc 0,6)",
 verdict1:"As 10 melhores juntas reteriam mais do que o escoamento aproveitável de um ano normal: não encheriam todas. Construir poucas, altas nas bacias, e deixar cada uma encher antes da seguinte.",verdict2:"O armazenamento candidato fica abaixo do escoamento aproveitável: há margem para mais retenção.",
 src:"Fonte: arquivo Open-Meteo (reanálise ERA5-Land, malha ~9 km), 1991–2020. A chuva de reanálise nesta costa fica abaixo das normais IPMA (Odemira ≈ 600 mm) — tratar os totais como conservadores. A geada é média de malha: a camada de bolsas de geada no mapa é a verdade local.",days:"dias",mm:"mm"};
const MON=EN?["J","F","M","A","M","J","J","A","S","O","N","D"]:["J","F","M","A","M","J","J","A","S","O","N","D"];
["eb","ttl","sub"].forEach(k=>document.getElementById(k).textContent=T[k]); document.getElementById("h-bal").textContent=T.bal; document.getElementById("h-temp").textContent=T.temp; document.getElementById("h-frost").textContent=T.frost; document.getElementById("h-rose").textContent=T.rose; document.getElementById("h-years").textContent=T.years; document.getElementById("h-bud").textContent=T.bud; document.getElementById("n-bal").textContent=T.nbal; document.getElementById("n-rose").textContent=T.nrose;
const fmt=n=>Number(n).toLocaleString(EN?"en-GB":"pt-PT");
fetch("climate.json").then(r=>r.json()).then(C=>{
  const a=C.annual; document.getElementById("top").innerHTML=[[T.p,a.p_mm,"mm"],[T.et,a.et0_mm,"mm"],[T.def,Math.abs(a.deficit_mm),"mm"],[T.dry,a.longest_dry_spell_days,T.days]].map(([k,v,u])=>`<div class="card"><div class="k">${k}</div><div class="big">${fmt(v)}<small>${u}</small></div></div>`).join("");
  // balance chart
  const narrow=window.innerWidth<640; const W=narrow?460:900,H=narrow?300:260,L=narrow?34:40,B=30,w=(W-L-20)/12; const mx=Math.max(...C.months.map(m=>Math.max(m.p_mm,m.et0_mm)))*1.1; const y=v=>H-B-(v/mx)*(H-B-20); let s="";
  C.months.forEach((m,i)=>{ const x=L+i*w; s+=`<rect class="pp" x="${x+6}" y="${y(m.p_mm)}" width="${w-12}" height="${H-B-y(m.p_mm)}" rx="3"/><text x="${x+w/2}" y="${H-10}" text-anchor="middle">${MON[i]}</text><text x="${x+w/2}" y="${y(m.p_mm)-4}" text-anchor="middle" style="fill:#9fc4e8">${Math.round(m.p_mm)}</text>`; });
  s+=`<path class="et" d="${C.months.map((m,i)=>(i?"L":"M")+(L+i*w+w/2)+","+y(m.et0_mm)).join(" ")}"/>`; C.months.forEach((m,i)=>{ s+=`<circle cx="${L+i*w+w/2}" cy="${y(m.et0_mm)}" r="3" fill="#ffd166"/><text x="${L+i*w+w/2}" y="${y(m.et0_mm)-7}" text-anchor="middle" style="fill:#ffd166">${Math.round(m.et0_mm)}</text>`; });
  [0,50,100,150,200].filter(v=>v<mx).forEach(v=>{ s+=`<line x1="${L}" x2="${W-20}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`; });
  const balEl=document.getElementById("bal"); balEl.setAttribute("viewBox",`0 0 ${W} ${H}`); balEl.innerHTML=s;
  // temperatures
  const t=document.getElementById("temp"); const tmax=Math.max(...C.months.map(m=>m.tmax))+3, tmin=Math.min(...C.months.map(m=>m.tmin))-3; const ty=v=>180-((v-tmin)/(tmax-tmin))*150; const tw=(440-50)/12; let ts="";
  [0,10,20,30].forEach(v=>{ if(v>tmin&&v<tmax) ts+=`<line x1="40" x2="430" y1="${ty(v)}" y2="${ty(v)}" stroke="rgba(255,255,255,.07)"/><text x="34" y="${ty(v)+3}" text-anchor="end">${v}°</text>`; });
  ts+=`<path d="${C.months.map((m,i)=>(i?"L":"M")+(40+i*tw+tw/2)+","+ty(m.tmax)).join(" ")}" stroke="#e07b39" fill="none" stroke-width="2"/><path d="${C.months.map((m,i)=>(i?"L":"M")+(40+i*tw+tw/2)+","+ty(m.tmin)).join(" ")}" stroke="#5b8fb9" fill="none" stroke-width="2"/>`;
  C.months.forEach((m,i)=>{ ts+=`<text x="${40+i*tw+tw/2}" y="195" text-anchor="middle">${MON[i]}</text>`; }); t.innerHTML=ts;
  // frost / hot days
  const fmx=Math.max(1,...C.months.map(m=>Math.max(m.frost_days,m.hot_days)))*1.2; const fy=v=>180-(v/fmx)*150; let fs="";
  C.months.forEach((m,i)=>{ const x=40+i*tw; fs+=`<rect x="${x+4}" y="${fy(m.frost_days)}" width="${tw/2-5}" height="${180-fy(m.frost_days)}" fill="#8fd3ff" rx="2"/><rect x="${x+tw/2+1}" y="${fy(m.hot_days)}" width="${tw/2-5}" height="${180-fy(m.hot_days)}" fill="#e07b39" rx="2"/><text x="${x+tw/2}" y="195" text-anchor="middle">${MON[i]}</text>`; });
  fs+=`<text x="40" y="12" style="fill:#8fd3ff">■ ≤ 0 °C</text><text x="120" y="12" style="fill:#e07b39">■ ≥ 35 °C</text>`; document.getElementById("frost").innerHTML=fs;
  // roses
  const rose=(id,r)=>{ const cx=100,cy=110,R=85; const mxv=Math.max(...r.freq_pct)||1; let q=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(255,255,255,.1)"/><circle cx="${cx}" cy="${cy}" r="${R/2}" fill="none" stroke="rgba(255,255,255,.08)"/>`;
    r.freq_pct.forEach((f,i)=>{ const a0=(i*22.5-11.25-90)*Math.PI/180, a1=(i*22.5+11.25-90)*Math.PI/180; const rr=R*f/mxv; q+=`<path d="M${cx},${cy} L${cx+rr*Math.cos(a0)},${cy+rr*Math.sin(a0)} A${rr},${rr} 0 0 1 ${cx+rr*Math.cos(a1)},${cy+rr*Math.sin(a1)} Z" fill="#5bc0de" fill-opacity=".55" stroke="#8fd3ff" stroke-width=".5"/>`; });
    ["N","E","S","W"].forEach((l,i)=>{ const a=(i*90-90)*Math.PI/180; q+=`<text x="${cx+(R+9)*Math.cos(a)}" y="${cy+(R+9)*Math.sin(a)+3}" text-anchor="middle">${l}</text>`; }); document.getElementById(id).innerHTML=q; };
  rose("rose-summer",C.wind.summer); rose("rose-winter",C.wind.winter);
  // years
  const ys=C.years; const ymx=Math.max(...ys.map(y=>y.p_mm))*1.1; const yw=(440-50)/ys.length; let yq=""; ys.forEach((yv,i)=>{ const h=(yv.p_mm/ymx)*150; yq+=`<rect x="${40+i*yw+1}" y="${180-h}" width="${yw-2}" height="${h}" fill="${yv.p_mm<C.annual.p_mm*.75?"#e07b39":"#5b8fb9"}" rx="1"><title>${yv.y}: ${yv.p_mm} mm</title></rect>`; if(i%5===0) yq+=`<text x="${40+i*yw+yw/2}" y="195" text-anchor="middle">${yv.y}</text>`; });
  yq+=`<line x1="40" x2="430" y1="${180-(C.annual.p_mm/ymx)*150}" y2="${180-(C.annual.p_mm/ymx)*150}" stroke="#ffd166" stroke-dasharray="4 3"/>`; document.getElementById("years").innerHTML=yq;
  // budget
  const b=C.water_budget; const d=b.dams; const rows=[[T.rain,b.rain_volume_m3,"m³"],[T.harv,b.harvestable_m3,"m³"]]; if(d){ rows.push([T.dam3,d.top3_storage_m3,"m³"],[T.dam10,d.top10_storage_m3,"m³"]); } rows.push([T.need,b.pasture_summer_need_m3_per_ha,"m³/ha"]);
  document.getElementById("bud").innerHTML=rows.map(([k,v,u])=>`<div class="stat"><span>${k}</span><b>${fmt(v)} ${u}</b></div>`).join(""); const card=document.getElementById("budget"); if(d){ const over=d.top10_storage_m3>b.harvestable_m3; card.classList.add(over?"warn":"ok"); document.getElementById("n-bud").textContent=(over?T.verdict1:T.verdict2)+" "+T.src; } else document.getElementById("n-bud").textContent=T.src;
}).catch(e=>{ document.getElementById("top").innerHTML=`<div class="card">climate.json?</div>`; });
</script>
</body></html>

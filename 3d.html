<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdenRise — Herdade 3D</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="ui.css">
<style>
:root{--bg:var(--bark);--panel:var(--night);--ink:var(--linen);--accent:var(--oak)}
#map{position:absolute;inset:44px 0 0 0}
#panel{position:absolute;top:56px;left:12px;z-index:5;width:270px;background:rgba(28,24,19,.94);backdrop-filter:blur(10px);border:1px solid var(--line-2);border-radius:12px;padding:14px 14px;font-size:12.5px;max-height:calc(100vh - 70px);overflow-y:auto;box-shadow:var(--sh)}
#panel h1{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em} #panel .sub{color:var(--muted);font-size:11px;margin-bottom:10px}
.row{display:flex;gap:5px;margin:6px 0}
.row button{flex:1;font:600 11px var(--ui);padding:6px 3px;background:var(--bark);color:var(--muted);border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:all .15s}
.row button.on{color:var(--linen);border-color:var(--oak);box-shadow:inset 0 0 0 1px var(--oak)}
.gl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 0 4px;border-top:1px solid var(--line);padding-top:8px}
.lyr{display:flex;align-items:center;gap:8px;padding:4px 4px;cursor:pointer;border-radius:6px} .lyr:hover{background:var(--night-2)}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.maplibregl-popup-content{background:var(--panel);color:var(--ink);border-radius:6px;font-size:12px;max-width:280px}
.maplibregl-popup-tip{border-top-color:var(--panel)!important}
.pp h3{margin:0 0 5px;font-size:13.5px} .pp td{padding:1px 8px 1px 0;vertical-align:top} .pp td:first-child{color:var(--muted)}
.hint{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.35}
a{color:var(--accent)}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1 id="ttl">EdenRise — Herdade 3D</h1>
  <div class="sub" id="sub">Gémeo digital · terreno real + ortofotos DGT</div>
  <div class="row" id="langs"></div>
  <div class="row" id="bases"></div>
  <div class="row"><button id="tilt">⟲ 3D / 2D</button><button id="fly">✈ Voo</button></div>
  <div class="row" id="views"></div>
  <div id="tree"></div>
  <div class="hint" id="hint"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="ops-data.js"></script>
<script src="hydro-data.js"></script>
<script src="trees-data.js"></script>
<script src="buildings-data.js"></script>
<script src="suitability-data.js"></script>
<script src="work-data.js"></script>
<script>
const OGC = "https://ogcapi.dgterritorio.gov.pt/collections/";
const ogcMap = c => `${OGC}${c}/map?bbox={bbox-epsg-3857}&bbox-crs=http://www.opengis.net/def/crs/EPSG/0/3857&width=256&height=256&f=png`;
const BASES = {
  dgt25: {pt:"DGT 2025 · 25 cm", en:"DGT 2025 · 25 cm", maxzoom:20, tiles:[location.href.replace(/[^/]*$/,"") + "ortho2025/{z}/{x}/{y}.jpg"], attr:"Ortofotos 2025 © DGT", bounds:[-8.661,37.497,-8.628,37.526]},
  dgt18: {pt:"DGT 2018 · 25 cm", en:"DGT 2018 · 25 cm", tiles:[ogcMap("ortos2018-rgb")], attr:"Ortofotos 2018 © DGT"},
  dgt23: {pt:"DGT 2023 · 30 cm", en:"DGT 2023 · 30 cm", tiles:[ogcMap("ortos-rgb")], attr:"OrtoSat2023 © DGT"},
  esri:  {pt:"Esri", en:"Esri", tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], attr:"© Esri & partners"},
};
let LANG = "pt"; try{ LANG = localStorage.getItem("edr_lang") || ((navigator.language||"pt").toLowerCase().startsWith("pt")?"pt":"en"); }catch(e){}
const T = {pt:{ttl:"EdenRise — Herdade 3D",sub:"Gémeo digital · terreno real + ortofotos DGT",hint:"Arrastar com botão direito / dois dedos para inclinar e rodar. Clicar em qualquer elemento para a ficha. Terreno: Copernicus/Terrarium (30 m) — passa a 50 cm com o LiDAR DGT.",
             groups:{core:"Herdade",ops:"Operações",hydro:"Água & terreno",trees:"🌳 Árvores (LiDAR 2024)",build:"🏗️ Edifícios & planeamento"}, fly:"✈ Voo", tilt:"⟲ 3D / 2D"},
           en:{ttl:"EdenRise — Estate 3D",sub:"Digital twin · real terrain + DGT orthophotos",hint:"Right-drag / two fingers to tilt and rotate. Click any feature for its record. Terrain: Copernicus/Terrarium (30 m) — upgrades to 50 cm with DGT LiDAR.",
             groups:{core:"Estate",ops:"Operations",hydro:"Water & terrain",trees:"🌳 Trees (LiDAR 2024)",build:"🏗️ Buildings & planning"}, fly:"✈ Fly", tilt:"⟲ 3D / 2D"}};
// layer catalogue (subset of the 2D map, chosen for 3D legibility)
const LAYERS = [
 ["core","cadastre_parcels",{pt:"Limite da herdade",en:"Estate boundary"},"line","#ffffff",2.4,true],
 ["core","subsidy_parcels",{pt:"Parcelas de subsídio",en:"Subsidy parcels"},"line","#76ff03",1.6,false],
 ["core","buildings_pt",{pt:"Edifícios",en:"Buildings"},"circle","#4caf50",7,true],
 ["core","water_network_ln",{pt:"Condutas de água",en:"Water pipes"},"line","#29b6f6",2.2,true],
 ["core","water_sources_pt",{pt:"Furos & poços",en:"Boreholes & wells"},"circle","#03a9f4",6,true],
 ["core","water_storage_pt",{pt:"Tanques & charcas",en:"Tanks & ponds"},"circle","#00bcd4",6,true],
 ["core","wastewater_pt",{pt:"Fossas",en:"Septic tanks"},"circle","#8d6e63",6,false],
 ["core","power_ln",{pt:"Eletricidade",en:"Electricity"},"line","#ffd600",2.2,true],
 ["core","paths_ln",{pt:"Caminhos",en:"Paths"},"line","#d7ccc8",2,true],
 ["core","grazing_parks_pg",{pt:"Parques de pastoreio",en:"Grazing parks"},"fill","#d4e157",.22,true],
 ["core","agri_features_pg",{pt:"Produção vegetal",en:"Crops"},"fill","#66bb6a",.3,false],
 ["core","hedges_ln",{pt:"Sebes",en:"Hedges"},"line","#2e7d32",2.4,false],
 ["core","tree_actions_pt",{pt:"Cortes de árvores",en:"Tree cuts"},"circle","#ff9800",5,false],
 ["ops","asset_registry",{pt:"Ativos (EDR-…)",en:"Assets (EDR-…)"},"circle","#ffffff",5,false],
 ["ops","fire_fuel_strips",{pt:"Faixas de combustível",en:"Fuel strips"},"fill","#ff5722",.18,false],
 ["ops","boundary_deviations",{pt:"Desvios de limite",en:"Boundary deviations"},"fill","#e91e63",.35,false],
 ["hydro","hydro_streams",{pt:"Linhas de água (LiDAR 2 m)",en:"Modelled streams (LiDAR 2 m)"},"line","#40c4ff",2.2,true],
 ["hydro","hydro_catchments",{pt:"Bacias de drenagem",en:"Catchments"},"line","#80deea",1.2,false],
 ["trees","tree_tops",{pt:"Árvores individuais (LiDAR)",en:"Individual trees (LiDAR)"},"circle","#2e7d32",3.5,false],
 ["trees","tree_crowns",{pt:"Copas — vigor 2025 (verde→vermelho)",en:"Tree crowns — 2025 vigour (green→red)"},"fill-vigour","#43a047",.55,false],
 ["build","building_footprints",{pt:"Edifícios 3D (LiDAR)",en:"Buildings 3D (LiDAR)"},"extrude","#ffcc80",1,true],
 ["build","suitability_zones",{pt:"Zonas aptas para construir (score ≥65)",en:"Build-suitable zones (score ≥65)"},"fill-score","#ffee58",.45,false],
];
const HYDRO = (typeof HYDRODATA !== "undefined") ? HYDRODATA : {};
const TREES = (typeof TREEDATA !== "undefined") ? TREEDATA : {};
const BLD = (typeof BUILDINGDATA !== "undefined") ? BUILDINGDATA : {};
const SUIT = (typeof SUITDATA !== "undefined") ? SUITDATA : {};
const src = t => DATA[t] || (typeof OPSDATA!=="undefined" && OPSDATA[t]) || HYDRO[t] || TREES[t] || BLD[t] || SUIT[t];
let curBase = "dgt25";
const map = new maplibregl.Map({container:"map", zoom:14.3, center:[-8.645,37.512], pitch:52, bearing:-20, maxPitch:75,
  style:{version:8, sources:{
    terrain:{type:"raster-dem", tiles:[location.href.replace(/[^/]*$/,"") + "terrain/{z}/{x}/{y}.png"], encoding:"mapbox", tileSize:256, minzoom:8, maxzoom:16,
             bounds:[-9.55,36.6,-7.75,38.45], attribution:"Terreno: LiDAR 2024 © DGT (50 cm) + Terrarium"},
    base:{type:"raster", tiles:BASES[curBase].tiles, tileSize:256, attribution:BASES[curBase].attr, maxzoom:BASES[curBase].maxzoom||19},
    fallback:{type:"raster", tiles:[ogcMap("ortos-rgb")], tileSize:256, attribution:"OrtoSat2023 © DGT"},
    fwi:{type:"raster", tiles:["https://maps.effis.emergency.copernicus.eu/effis?service=WMS&version=1.3.0&request=GetMap&layers=mf010.fwi&styles=&crs=EPSG:3857&bbox={bbox-epsg-3857}&width=256&height=256&format=image/png&time="+new Date().toISOString().slice(0,10)], tileSize:256, attribution:"EFFIS © Copernicus"},
  }, layers:[
    {id:"fallback", type:"raster", source:"fallback", paint:{"raster-saturation":.12,"raster-contrast":.08,"raster-brightness-min":.02}},
    {id:"base", type:"raster", source:"base", paint:{"raster-saturation":.18,"raster-contrast":.12,"raster-resampling":"linear","raster-fade-duration":200}},
    {id:"hill", type:"hillshade", source:"terrain", paint:{"hillshade-exaggeration":.12,"hillshade-shadow-color":"#2a2117","hillshade-highlight-color":"#fff6e0","hillshade-accent-color":"#3b3126"}},
    {id:"fwi", type:"raster", source:"fwi", paint:{"raster-opacity":.45}, layout:{visibility:"none"}},
  ]}});   // terrain is enabled after style.load — declaring it in the initial style blocks the first render
window.__errs = []; map.on("error", e => window.__errs.push(String(e && e.error && e.error.message || e)));
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), "top-right");
map.addControl(new maplibregl.ScaleControl({unit:"metric"}));
map.addControl(new maplibregl.TerrainControl({source:"terrain", exaggeration:1.25}), "top-right");
const FIELDS = {pt:{asset_id:"ID",tree_id:"ID árvore",height_m:"Altura (m)",crown_m2:"Copa (m²)",crown_diam_m:"Diâm. copa (m)",ndvi_2025:"NDVI 2025",vigour:"Vigor",oak_candidate:"Candidata sobro/azinho",
                    roof_elev_m:"Cota telhado (m)",footprint_m2:"Implantação (m²)",score:"Score aptidão",rank:"Posição",area_m2:"Área (m²)",slope_pct_mean:"Declive médio (%)",dist_path_m:"Dist. caminho (m)",dist_water_m:"Dist. rede água (m)",dist_building_m:"Dist. edifício (m)",aspect:"Exposição",status:"Estado",category:"Categoria",system:"Sistema",year:"Ano",cadastral_article:"Art.º",areas_doc_m2:"Áreas (docs) m²",m2:"Área",m:"Comprimento",kind:"Tipo",area_ha:"Área (ha)",source:"Fonte"},
                en:{asset_id:"ID",tree_id:"Tree ID",height_m:"Height (m)",crown_m2:"Crown (m²)",crown_diam_m:"Crown diam. (m)",ndvi_2025:"NDVI 2025",vigour:"Vigour",oak_candidate:"Cork/holm-oak candidate",
                    roof_elev_m:"Roof elev. (m)",footprint_m2:"Footprint (m²)",score:"Suitability score",rank:"Rank",area_m2:"Area (m²)",slope_pct_mean:"Mean slope (%)",dist_path_m:"Dist. to track (m)",dist_water_m:"Dist. to water net (m)",dist_building_m:"Dist. to building (m)",aspect:"Aspect",status:"Status",category:"Category",system:"System",year:"Year",cadastral_article:"Article",areas_doc_m2:"Areas (docs) m²",m2:"Area",m:"Length",kind:"Type",area_ha:"Area (ha)",source:"Source"}};
function popupHtml(p){
  const F = FIELDS[LANG]; let h = `<div class="pp"><h3>${p.name||p.asset_id||"—"}</h3><table>`;
  for(const k of Object.keys(F)) if(p[k]!==undefined && p[k]!==null && p[k]!=="") h += `<tr><td>${F[k]}</td><td>${k==="m2"?Number(p.m2).toLocaleString()+" m²":k==="m"?Number(p.m).toLocaleString()+" m":p[k]}</td></tr>`;
  h += "</table>"; if(p.notes_text) h += `<div style="margin-top:5px;color:#9ba391;font-size:11px;max-height:90px;overflow:auto">${String(p.notes_text).slice(0,400)}</div>`;
  if(typeof WORKDATA !== "undefined"){
    let insp = []; try{ insp = typeof p.inspections==="string" ? JSON.parse(p.inspections) : (p.inspections||[]); }catch(e){}
    const keys = (p.key ? [p.key] : []).concat(insp.map(i=>i.key));
    for(const k of keys){ const w = WORKDATA.items[k]; if(!w) continue;
      const col = w.closed ? "#8fae7e" : (w.cu==="in progress" ? "#7fa8cc" : "#cda452");
      h += `<div style="margin-top:4px;font-size:11.5px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${col};margin-right:5px"></span><b>${k}</b> · ${w.cu||"—"} · ${LANG==="en"?"map":"mapa"}: ${w.gis||"—"} ${w.url?`· <a href="${w.url}" target="_blank">${LANG==="en"?"task":"tarefa"}</a>`:""}</div>`; }
  }
  return h+"</div>";
}
const state = {};
let layersAdded = false;
map.on("style.load", ()=>{            // fires once the style is parsed — does not wait on slow remote sources
  if(layersAdded) return; layersAdded = true;
  for(const [grp, t, title, kind, color, size, on] of LAYERS){
    const fc = src(t); if(!fc) continue;
    map.addSource(t, {type:"geojson", data:fc});
    const vis = on ? "visible" : "none";
    if(kind==="fill"){
      map.addLayer({id:t, type:"fill", source:t, paint:{"fill-color":color,"fill-opacity":size}, layout:{visibility:vis}});
      map.addLayer({id:t+"_o", type:"line", source:t, paint:{"line-color":color,"line-width":1.2}, layout:{visibility:vis}});
    } else if(kind==="fill-vigour"){
      const col = ["match",["get","vigour"],"vigoroso","#43a047","moderado","#fdd835","stressado","#e53935","#9e9e9e"];
      map.addLayer({id:t, type:"fill", source:t, paint:{"fill-color":col,"fill-opacity":size}, layout:{visibility:vis}});
    } else if(kind==="fill-score"){
      const col = ["interpolate",["linear"],["get","score"],65,"#fff59d",75,"#ffca28",85,"#ff8f00"];
      map.addLayer({id:t, type:"fill", source:t, paint:{"fill-color":col,"fill-opacity":size}, layout:{visibility:vis}});
      map.addLayer({id:t+"_o", type:"line", source:t, paint:{"line-color":"#ff6f00","line-width":1.6}, layout:{visibility:vis}});
    } else if(kind==="extrude"){
      map.addLayer({id:t, type:"fill-extrusion", source:t, paint:{"fill-extrusion-color":["match",["get","status"],"registado","#a5d6a7","nao_registado_licenciado","#ef9a9a","#ffe0b2"],
        "fill-extrusion-height":["get","height_m"],"fill-extrusion-opacity":.9}, layout:{visibility:vis}});
    } else if(kind==="line"){
      map.addLayer({id:t, type:"line", source:t, paint:{"line-color":color,"line-width":size}, layout:{visibility:vis,"line-cap":"round","line-join":"round"}});
    } else {
      map.addLayer({id:t, type:"circle", source:t, paint:{"circle-radius":size,"circle-color":color,"circle-stroke-color":"#111","circle-stroke-width":1.2}, layout:{visibility:vis}});
    }
    state[t] = on;
    map.on("click", t, e=>{ new maplibregl.Popup().setLngLat(e.lngLat).setHTML(popupHtml(e.features[0].properties)).addTo(map); });
    map.on("mouseenter", t, ()=>map.getCanvas().style.cursor="pointer"); map.on("mouseleave", t, ()=>map.getCanvas().style.cursor="");
  }
  buildPanel(); buildViews();
  setTimeout(()=>{ map.setTerrain({source:"terrain", exaggeration:1.25});
    try{ map.setSky({"sky-color":"#8fb3d9","horizon-color":"#e9dcc4","fog-color":"#d9ccb3","sky-horizon-blend":.6,"horizon-fog-blend":.55,"fog-ground-blend":.72,"atmosphere-blend":["interpolate",["linear"],["zoom"],0,1,12,.55,16,.15]}); }catch(e){}
    try{ map.setLight({anchor:"map", position:[1.4,105,42], color:"#fff4e2", intensity:.42}); }catch(e){}
  }, 300);
});
function setVis(t, on){ state[t]=on; const v = on?"visible":"none"; if(map.getLayer(t)) map.setLayoutProperty(t,"visibility",v); if(map.getLayer(t+"_o")) map.setLayoutProperty(t+"_o","visibility",v); }
function buildPanel(){
  const tx = T[LANG];
  document.getElementById("ttl").textContent = tx.ttl; document.getElementById("sub").textContent = tx.sub;
  document.getElementById("hint").textContent = tx.hint; document.getElementById("fly").textContent = tx.fly; document.getElementById("tilt").textContent = tx.tilt;
  const L = document.getElementById("langs"); L.innerHTML = "";
  [["pt","Português"],["en","English"]].forEach(([c,l])=>{ const b=document.createElement("button"); b.textContent=l; if(c===LANG) b.classList.add("on");
    b.onclick=()=>{ LANG=c; try{localStorage.setItem("edr_lang",c);}catch(e){} buildPanel(); }; L.appendChild(b); });
  const B = document.getElementById("bases"); B.innerHTML = "";
  for(const [k,v] of Object.entries(BASES)){ const b=document.createElement("button"); b.textContent=v[LANG]; if(k===curBase) b.classList.add("on");
    b.onclick=()=>{ curBase=k; map.getSource("base").setTiles(v.tiles); buildPanel(); }; B.appendChild(b); }
  const tree = document.getElementById("tree"); tree.innerHTML = "";
  let cur = null;
  for(const [grp, t, title, kind, color] of LAYERS){
    if(!src(t)) continue;
    if(grp!==cur){ cur=grp; const g=document.createElement("div"); g.className="gl"; const n=LAYERS.filter(x=>x[0]===grp&&src(x[1])).length, on=LAYERS.filter(x=>x[0]===grp&&state[x[1]]).length; g.innerHTML=`<span>${tx.groups[grp]}</span><span style="float:right;font-weight:400;color:var(--dim)">${on}/${n}</span>`; tree.appendChild(g); }
    const row=document.createElement("label"); row.className="lyr";
    const c=document.createElement("input"); c.type="checkbox"; c.checked=!!state[t]; c.onchange=()=>setVis(t,c.checked);
    const sw=document.createElement("span"); sw.className="sw"; sw.style.background=color;
    row.appendChild(c); row.appendChild(sw); row.appendChild(document.createTextNode(title[LANG])); tree.appendChild(row);
  }
  // live fire danger
  const g=document.createElement("div"); g.className="gl"; g.textContent = LANG==="en"?"🛰️ Live":"🛰️ Em direto"; tree.appendChild(g);
  const row=document.createElement("label"); row.className="lyr"; const c=document.createElement("input"); c.type="checkbox";
  c.checked = map.getLayoutProperty("fwi","visibility")==="visible"; c.onchange=()=>map.setLayoutProperty("fwi","visibility",c.checked?"visible":"none");
  const sw=document.createElement("span"); sw.className="sw"; sw.style.background="#ff7043";
  row.appendChild(c); row.appendChild(sw); row.appendChild(document.createTextNode(LANG==="en"?"Fire danger today (EFFIS)":"Perigo de incêndio hoje (EFFIS)")); tree.appendChild(row);
}
const VIEWS = [["Casa","Main house",[-8.6412,37.5148],17.2,64,-30],["Moinhos","Mills",[-8.6455,37.5165],17,60,25],["Norte","North",[-8.6485,37.5205],16,58,-10],["Sul","South",[-8.6440,37.5040],16,58,160],["Vale","Valley",[-8.6395,37.5100],16.4,66,-70]];
function buildViews(){ const v=document.getElementById("views"); v.innerHTML=""; VIEWS.forEach(([pt,en,c,z,p,b])=>{ const bt=document.createElement("button"); bt.textContent=LANG==="en"?en:pt; bt.onclick=()=>map.flyTo({center:c,zoom:z,pitch:p,bearing:b,duration:2200,essential:true}); v.appendChild(bt); }); }
buildViews();
document.getElementById("tilt").onclick = ()=> map.easeTo({pitch: map.getPitch()>10 ? 0 : 60, duration:800});
document.getElementById("fly").onclick = ()=> {
  map.easeTo({center:[-8.652,37.508], zoom:15.2, pitch:65, bearing:-60, duration:2500});
  setTimeout(()=>map.easeTo({center:[-8.641,37.516], zoom:15.4, pitch:62, bearing:40, duration:5000}), 2600);
};
</script>
<script src="nav.js"></script>
</body>
</html>

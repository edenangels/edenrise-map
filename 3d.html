<script>

  }, layers:[

const FIELDS = {pt:{asset_id:"ID",tree_id:"ID árvore",height_m:"Altura (m)",crown_m2:"Copa (m²)",crown_diam_m:"Diâm. copa (m)",ndvi_2025:"NDVI 2025",vigour:"Vigor",oak_candidate:"Candidata sobro/azinho",

function popupHtml(p){

  }

const state = {}; const added = new Set();
function rgbaAlpha(s){ const m=/rgba?\([^)]*,\s*([\d.]+)\)/.exec(s||""); return m ? +m[1] : (s==="rgba(0,0,0,0)"?0:.25); }

function placeMode(kind){ placing=kind; map.getCanvas().style.cursor="crosshair"; const el=document.getElementById("placehint"); if(el){ el.hidden=false; el.textContent=LANG==="en"?`Tap the ground where the ${kind} goes · Esc cancels`:`Toque no terreno onde fica ${kind} · Esc cancela`; } }
map.on("click",async e=>{ if(!placing) return; const kind=placing; placing=null; map.getCanvas().style.cursor=""; const el=document.getElementById("placehint"); if(el) el.hidden=true; const key=localStorage.getItem("edr_role_key")||""; if(!key){ alert(LANG==="en"?"Sign in on the 2D map first (EDIT → team key).":"Entre primeiro no mapa 2D (EDITAR → chave da equipa)."); return; }
  const name=prompt(LANG==="en"?"Name:":"Nome:",kind); if(name===null) return; const h=+(prompt(LANG==="en"?"Height (m):":"Altura (m):",kind==="edificio"?"3.2":"2.5")||0); const size=+(prompt(LANG==="en"?"Footprint side (m):":"Lado da implantação (m):","8")||8);
  const kx=111320*Math.cos(e.lngLat.lat*Math.PI/180), ky=110540, d=size/2; const ring=[[-d,-d],[d,-d],[d,d],[-d,d],[-d,-d]].map(([x,y])=>[e.lngLat.lng+x/kx,e.lngLat.lat+y/ky]);
  const r=await fetch(API+"/features",{method:"POST",headers:{"Content-Type":"application/json","X-Role-Key":key},body:JSON.stringify({layer:"propostas",name,kind,geometry:{type:"Polygon",coordinates:[ring]},props:{preset:kind,altura_m:h},note:LANG==="en"?"placed from the 3D twin":"colocado a partir do 3D",actor:localStorage.getItem("edr_actor")||"",measures:{kind:"polygon",area_m2:size*size,comprimento_m:size,largura_m:size}})}).then(r=>r.json()).catch(()=>({}));
  if(r.ok){ loadTeam(); } else alert(r.need||r.error||"—"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&placing){ placing=null; map.getCanvas().style.cursor=""; const el=document.getElementById("placehint"); if(el) el.hidden=true; } });
function buildSunUI(){ const host=document.getElementById("views"); if(!host||document.getElementById("sunbar")) return; const bar=document.createElement("div"); bar.id="sunbar"; bar.style.cssText="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font:12px Archivo,sans-serif";
  bar.innerHTML=`<span id="sunlbl" style="font:600 11px 'IBM Plex Mono',monospace;color:var(--straw,#c9a227)"></span><input type="range" id="sunh" min="0" max="1439" step="10" style="flex:1;min-width:120px" aria-label="hour"><input type="date" id="sund" style="background:#2a241d;color:#f1e9d8;border:1px solid #4a4033;border-radius:6px;padding:4px 6px;font:12px Archivo,sans-serif" aria-label="date"><span style="color:#9a8f80">·</span><label style="display:flex;gap:6px;align-items:center;color:#9a8f80">${LANG==="en"?"relief":"relevo"} <input type="range" id="exag" min="1" max="2.5" step=".05" value="1.25" style="width:80px" aria-label="exaggeration"></label><button id="pl-edificio" style="padding:6px 10px;border-radius:999px;border:1px solid #4a4033;background:#2a241d;color:#f1e9d8;font:700 11px Archivo,sans-serif;cursor:pointer">＋ ${LANG==="en"?"building":"edifício"}</button><button id="pl-tanque" style="padding:6px 10px;border-radius:999px;border:1px solid #4a4033;background:#2a241d;color:#f1e9d8;font:700 11px Archivo,sans-serif;cursor:pointer">＋ ${LANG==="en"?"tank":"tanque"}</button><div id="placehint" hidden style="width:100%;color:#c9a227;font:600 12px Archivo,sans-serif"></div>`;
  host.parentNode.insertBefore(bar,host.nextSibling); const now=new Date(); bar.querySelector("#sunh").value=now.getHours()*60+now.getMinutes(); bar.querySelector("#sund").value=now.toISOString().slice(0,10);
  const upd=()=>{ const d=new Date(bar.querySelector("#sund").value+"T00:00:00"); const m=+bar.querySelector("#sunh").value; d.setHours(Math.floor(m/60),m%60); setSun(d); }; bar.querySelector("#sunh").oninput=upd; bar.querySelector("#sund").onchange=upd;
  bar.querySelector("#exag").oninput=e=>{ try{ map.setTerrain({source:"terrain",exaggeration:+e.target.value}); }catch(err){} }; bar.querySelector("#pl-edificio").onclick=()=>placeMode("edificio"); bar.querySelector("#pl-tanque").onclick=()=>placeMode("tanque"); }
setTimeout(buildSunUI,1200);
(function boot3d(n){ let ok=false; try{ if(map.getSource("terrain")){ setSun(sunDate||new Date()); loadTeam(); ok=true; } }catch(e){} if(!ok&&n<40) setTimeout(()=>boot3d(n+1),500); })(0);
/* ---------- photoreal step 1: surface model terrain (DSM), LiDAR point cloud as 3D Tiles (deck.gl), ortho-coloured roofs ---------- */
const PC_URL="https://edenangels.github.io/edenrise-3d/tiles/tileset.json"; let deckOverlay=null, pcOn=false, pcSize=2;
function pcLayer(){ return new deck.Tile3DLayer({id:"lidar",data:PC_URL,pointSize:pcSize,opacity:1,pickable:false,loadOptions:{"3d-tiles":{loadGLTF:false}},onTilesetLoad:(ts)=>{ const el=document.getElementById("pcinfo"); if(el) el.textContent=`LiDAR 2024 · ${LANG==="en"?"loaded":"carregada"}`; },_subLayerProps:{pointcloud:{pointSize:pcSize}}}); }
function togglePC(on){ pcOn=on; if(!window.deck){ alert("deck.gl"); return; } if(!deckOverlay){ deckOverlay=new deck.MapboxOverlay({interleaved:true,layers:[]}); map.addControl(deckOverlay); } deckOverlay.setProps({layers:on?[pcLayer()]:[]}); }
let surfaceOn=false;
function toggleSurface(on){ surfaceOn=on; try{ if(!map.getSource("surface")) map.addSource("surface",{type:"raster-dem",tiles:[location.href.replace(/[^/]*$/,"")+"surface/{z}/{x}/{y}.png"],encoding:"mapbox",tileSize:256,minzoom:8,maxzoom:16}); const ex=(document.getElementById("exag")&&+document.getElementById("exag").value)||1.25; map.setTerrain({source:on?"surface":"terrain",exaggeration:on?1:ex}); if(map.getLayer("building_footprints")) map.setLayoutProperty("building_footprints","visibility",on?"none":"visible"); }catch(e){} }
fetch("roofs.json").then(r=>r.json()).then(roofs=>{ const ids=Object.keys(roofs); if(!ids.length) return; const expr=["match",["to-string",["coalesce",["get","core_fid"],["get","name"]]]]; ids.forEach(k=>expr.push(k,roofs[k])); expr.push("#d9c7a3"); const apply=()=>{ try{ if(map.getLayer("building_footprints")) map.setPaintProperty("building_footprints","fill-extrusion-color",expr); }catch(e){} }; apply(); setTimeout(apply,3000); }).catch(()=>{});
function buildPCUI(){ const bar=document.getElementById("sunbar"); if(!bar||document.getElementById("pcbar")) return; const b=document.createElement("div"); b.id="pcbar"; b.style.cssText="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font:12px Archivo,sans-serif;color:#d9cfbc";
  b.innerHTML=`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="pcchk"> ${LANG==="en"?"LiDAR cloud (true colour)":"Nuvem LiDAR (cor real)"}</label><input type="range" id="pcsz" min="1" max="5" step=".5" value="2" style="width:70px" aria-label="point size"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="sfchk"> ${LANG==="en"?"Surface model (trees & roofs)":"Modelo de superfície (árvores e telhados)"}</label><span id="pcinfo" style="color:#9a8f80;font:11px 'IBM Plex Mono',monospace"></span>`;
  bar.parentNode.insertBefore(b,bar.nextSibling); b.querySelector("#pcchk").onchange=e=>togglePC(e.target.checked); b.querySelector("#pcsz").oninput=e=>{ pcSize=+e.target.value; if(pcOn) deckOverlay.setProps({layers:[pcLayer()]}); }; b.querySelector("#sfchk").onchange=e=>toggleSurface(e.target.checked); }
setTimeout(buildPCUI,1600);

const VIEWS = [["Casa","Main house",[-8.6412,37.5148],17.2,64,-30],["Moinhos","Mills",[-8.6455,37.5165],17,60,25],["Norte","North",[-8.6485,37.5205],16,58,-10],["Sul","South",[-8.6440,37.5040],16,58,160],["Vale","Valley",[-8.6395,37.5100],16.4,66,-70]];
function buildViews(){ const v=document.getElementById("views"); v.innerHTML=""; VIEWS.forEach(([pt,en,c,z,p,b])=>{ const bt=document.createElement("button"); bt.textContent=LANG==="en"?en:pt; bt.onclick=()=>map.flyTo({center:c,zoom:z,pitch:p,bearing:b,duration:2200,essential:true}); v.appendChild(bt); }); }
buildViews();

};

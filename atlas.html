<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EdenRise — Atlas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="sites.js?v=39b9c807"></script>
<script>edrLoadData(["data.js?v=0737499e", "ops-data.js?v=2751505a"])</script>
<style>
body{background:#fff;color:#1c1813;font:12.5px/1.4 "Archivo","Helvetica Neue",Arial,sans-serif;margin:0} .bar{position:sticky;top:0;background:#1c1813;color:#f1e9d8;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5} .bar select,.bar button,.bar a{font:600 12px "Archivo",sans-serif;padding:7px 12px;border-radius:999px;border:1px solid #4a4033;background:#2a241d;color:#f1e9d8;cursor:pointer;text-decoration:none} .bar .n{color:#9a8f80;font:11px "IBM Plex Mono",monospace}
.page{width:210mm;min-height:270mm;margin:14px auto;padding:14mm 14mm 10mm;box-sizing:border-box;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);page-break-after:always;display:grid;grid-template-rows:auto 1fr auto;gap:8px}
.hd{display:grid;grid-template-columns:1fr 92px;gap:12px;border-bottom:2px solid #1c1813;padding-bottom:8px} .eyebrow{font:600 10px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#7a6f60} h1{font:600 22px "Bricolage Grotesque","Archivo",sans-serif;margin:2px 0 4px;letter-spacing:-.01em} .sub{color:#4a423a}
.map{height:118mm;border:1px solid #ccc;border-radius:4px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:6px} .grid div{display:flex;justify-content:space-between;border-bottom:1px solid #e6e1d8;padding:3px 0} .grid span{color:#7a6f60} .grid b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.ft{display:flex;justify-content:space-between;font:10px "IBM Plex Mono",monospace;color:#7a6f60;border-top:1px solid #e6e1d8;padding-top:6px} .pn{font-weight:600}
@media print{ .bar{display:none} .page{margin:0;box-shadow:none;width:auto;min-height:auto} }
</style></head><body>
<div class="bar"><span class="eyebrow" style="color:#f1e9d8">EdenRise · Atlas</span>
<select id="type"><option value="buildings">Edifícios</option><option value="strips">Faixas de combustível</option><option value="team">Propostas da equipa</option><option value="assets">Registo de ativos</option></select>
<select id="base"><option value="ortho">Ortofoto 2025</option><option value="esri">Esri</option></select>
<button id="go">Gerar</button><button onclick="window.print()">🖨 Imprimir / PDF</button><a href="index.html">← Mapa</a><span class="n" id="n"></span></div>
<div id="pages"></div>
<script>
const API="https://edenrise-brain.edenrise.workers.dev"; const EN=(localStorage.getItem("edr_lang")||"pt")==="en"; const q=new URLSearchParams(location.search); if(q.get("type")) document.getElementById("type").value=q.get("type");
const esc=s=>String(s??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
function centre(f){ const g=f.geometry; if(g.type==="Point") return L.latLng(g.coordinates[1],g.coordinates[0]); return L.geoJSON(f).getBounds().getCenter(); }
async function items(type){ if(type==="buildings") return (DATA.buildings_pt||{features:[]}).features.map(f=>({f,title:f.properties.name||"Edifício",sub:[f.properties.status,f.properties.uso||f.properties.use].filter(Boolean).join(" · "),rows:Object.entries(f.properties).filter(([k,v])=>v!=null&&v!==""&&!/geom|fid/.test(k)).slice(0,14),id:f.properties.asset_id||f.properties.name}));
  if(type==="strips") return (OPSDATA.fire_fuel_strips||{features:[]}).features.map(f=>({f,title:`${f.properties.key} · ${f.properties.source_name||""}`,sub:f.properties.kind==="edificio_50m"?"faixa 50 m à volta de edifício · DL 82/2021":"faixa 10 m ao longo de via · DL 82/2021",rows:[["área m²",f.properties.area_m2],["raio m",f.properties.radius_m],["estado",f.properties.status],["ref legal",f.properties.legal_ref]],id:f.properties.key}));
  if(type==="assets") return (OPSDATA.asset_registry||{features:[]}).features.slice(0,150).map(f=>({f,title:f.properties.name||f.properties.asset_id,sub:[f.properties.asset_id,f.properties.category].filter(Boolean).join(" · "),rows:Object.entries(f.properties).filter(([k,v])=>v!=null&&v!==""&&!/geom|fid/.test(k)).slice(0,14),id:f.properties.asset_id}));
  const d=await fetch(apiSite(API+"/features")).then(r=>r.json()).catch(()=>({features:[]})); return (d.features||[]).map(f=>{ const p=f.properties, m=p.measures||{}; return {f,title:p.name||p.kind||p.id,sub:[p.status,p.category?p.category.replace(/^\d+ · /,""):"",p.created_by,String(p.updated_at||p.created_at).slice(0,10)].filter(Boolean).join(" · "),rows:[["tipo",p.preset],["comprimento m",m.comprimento_m],["largura m",m.largura_m],["área m²",m.area_m2],["cota m",m.cota_m??m.cota_inicio_m],["declive %",m.declive_pct??m.declive_medio_pct],["nota",p.note]].filter(([k,v])=>v!=null&&v!==""),id:p.id}; }); }
async function gen(){ const type=document.getElementById("type").value, base=document.getElementById("base").value; const list=await items(type); const pg=document.getElementById("pages"); pg.innerHTML=""; document.getElementById("n").textContent=`${list.length} ${EN?"pages":"páginas"}`;
  list.forEach((it,i)=>{ const c=centre(it.f); const url=`https://edenangels.github.io/edenrise-map/index.html#v=${c.lat.toFixed(6)},${c.lng.toFixed(6)},19`; const el=document.createElement("div"); el.className="page";
    el.innerHTML=`<div class="hd"><div><div class="eyebrow">EdenRise · atlas · ${esc(type)} · ${esc(it.id||"")}</div><h1>${esc(it.title)}</h1><div class="sub">${esc(it.sub)}</div></div><div class="qr" id="qr${i}"></div></div><div><div class="map" id="m${i}"></div><div class="grid">${it.rows.map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(typeof v==="number"?v.toLocaleString("pt-PT"):v)}</b></div>`).join("")}</div></div><div class="ft"><span>${url}</span><span class="pn">${i+1} / ${list.length}</span></div>`;
    pg.appendChild(el); new QRCode(el.querySelector(".qr"),{text:url,width:88,height:88,colorDark:"#1c1813",colorLight:"#ffffff"});
    const map=L.map(el.querySelector(".map"),{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,center:c,zoom:18});
    if(base==="ortho") L.tileLayer("ortho2025/{z}/{x}/{y}.jpg",{minZoom:12,maxNativeZoom:20,maxZoom:21}).addTo(map); L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,opacity:base==="ortho"?.5:1}).addTo(map).bringToBack();
    const gl=L.geoJSON(it.f,{style:{color:"#c9a227",weight:3,fillOpacity:.15},pointToLayer:(ft,ll)=>L.circleMarker(ll,{radius:9,color:"#c9a227",fillColor:"#c9a227",fillOpacity:.6})}).addTo(map); L.control.scale({imperial:false}).addTo(map);
    const fit=()=>{ map.invalidateSize(); const b=gl.getBounds(); if(map.distance(b.getSouthWest(),b.getNorthEast())<40) map.setView(b.getCenter(),19); else map.fitBounds(b.pad(.5),{maxZoom:19}); }; setTimeout(fit,100+i*30); try{ new ResizeObserver(fit).observe(el.querySelector(".map")); }catch(e){} }); }
document.getElementById("go").onclick=gen; gen();
</script></body></html>

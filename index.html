function popup(p){
  const F = fields_i18n();
  let h = `<div class="pp"><h3>${p.name||p.asset_id||p.tree_name||"—"}</h3><table>`;
  for(const k of Object.keys(F)){
    if(p[k]!==undefined && p[k]!==null && p[k]!==""){
      let v = p[k];
      if(k==="m2"||k==="area_m2") v = Number(v).toLocaleString(locale())+" m²";
      if(k==="m") v = Number(v).toLocaleString(locale())+" m";
      h += `<tr><td>${F[k]}</td><td>${v}</td></tr>`;
    }
  }
  h += "</table>";
  if(p.notes_text) h += `<div class="notes">${String(p.notes_text).slice(0,600)}</div>`;
  h += sparkline(p);
  h += workBadge(p);
  return h+"</div>";
}
// ── ClickUp mirror: live task status per work key (FIRE-/PERMIT- on the feature, INSP- via asset inspections) ──
function workBadge(p){
  if(typeof WORKDATA === "undefined") return "";
  const keys = []; if(p.key) keys.push(p.key);
  if(Array.isArray(p.inspections)) p.inspections.forEach(i=>keys.push(i.key));
  const rows = keys.map(k=>[k, WORKDATA.items[k]]).filter(([k,w])=>w);
  if(!rows.length) return "";
  const L = LANG==="en";
  let h = `<div class="spark"><div class="lbl">🔁 ${L?"ClickUp":"ClickUp"} · ${L?"synced":"sincronizado"} ${String(WORKDATA.synced).slice(0,16).replace("T"," ")}</div>`;
  for(const [k,w] of rows){
    const col = w.closed ? "#8fae7e" : (w.cu==="in progress" ? "#7fa8cc" : "#cda452");
    h += `<div style="font-size:12px;margin-top:3px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${col};margin-right:6px"></span><b>${k}</b> · ${w.cu||"—"} · ${L?"map":"mapa"}: ${w.gis||"—"}${w.due?" · "+w.due:""} ${w.url?`· <a href="${w.url}" target="_blank" style="color:#7fa8cc">${L?"open task":"abrir tarefa"}</a>`:""}</div>`;
  }
  return h + "</div>";
}
// ── satellite series (Sentinel-2) matched by zone name ──
function satSeries(p){
  if(typeof SATDATA === "undefined" || !p.name) return null;
  const pts = [];
  for(const s of Object.values(SATDATA.series)){ if(s.name === p.name) pts.push(...s.pts); }
  if(!pts.length) return null;
  // average same-date readings across polygons sharing the name
  const byDate = {};
  for(const [d,ndvi,ndmi] of pts){ const b = byDate[d] = byDate[d] || [0,0,0]; b[0]+=ndvi; b[1]+=ndmi; b[2]++; }
  return Object.entries(byDate).sort().map(([d,b])=>[d, b[0]/b[2], b[1]/b[2]]);
}
function sparkline(p){
  const s = satSeries(p); if(!s || s.length < 2) return "";
  const W=260, H=46, pad=3, vals = s.map(x=>x[1]), lo=Math.min(...vals), hi=Math.max(...vals);
  const x = i => pad + i*(W-2*pad)/(s.length-1), y = v => H-pad-((v-lo)/Math.max(hi-lo,0.05))*(H-2*pad);
  const path = vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  const last = s[s.length-1], first = s[0];
  const trend = last[1]-first[1];
  const lbl = LANG==="en"
    ? `Vegetation (NDVI) · ${first[0].slice(5)} → ${last[0].slice(5)} · latest ${last[1].toFixed(2)} · moisture ${last[2].toFixed(2)}`
    : `Vegetação (NDVI) · ${first[0].slice(5)} → ${last[0].slice(5)} · atual ${last[1].toFixed(2)} · humidade ${last[2].toFixed(2)}`;
  return `<div class="spark"><div class="lbl">🛰️ ${lbl} <b style="color:${trend<-0.05?'#ff7043':'#8fae7e'}">${trend>=0?'▲':'▼'}${Math.abs(trend).toFixed(2)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#8fae7e" stroke-width="1.8"/>
    <circle cx="${x(s.length-1).toFixed(1)}" cy="${y(last[1]).toFixed(1)}" r="2.6" fill="#ffeb3b"/></svg></div>`;
}

  tree_actions_pt:"tree", irrigation_pt:"drop", notes_pt:"pin",
  asset_registry:p=>({BLD:"house",WTR:"well",STO:"tank",WWT:"fossa",PWR:"bolt",TLC:"antenna",IRR:"drop"}[p.category]||"pin")};
function symIcon(kind, color, size){ return L.divIcon({className:"", iconSize:[size,size], iconAnchor:[size/2,size/2],
  html:`<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))"><circle cx="12" cy="12" r="11" fill="${color}" stroke="#111" stroke-width="1.5"/><g fill="#111" transform="translate(4.8 4.8) scale(.6)">${SVG[kind]}</g></svg>`}); }
function buildLayer(t, title, kind, color, opt, fc){
  const colOf = p => opt.cat ? (opt.colors[p[opt.cat]] || opt.other || color) : color;
  const sym = SYMBOL[t]; const size = Math.max(16, (opt.r||5)*3.4);
  return L.geoJSON(fc, {
    pointToLayer:(f,ll)=> sym ? L.marker(ll,{icon:symIcon(typeof sym==="function"?sym(f.properties):sym, colOf(f.properties), size)})
                              : L.circleMarker(ll,{radius:opt.r||5, fillColor:colOf(f.properties), color:"#1c1c1c", weight:1.2, fillOpacity:.95}),
    style:f=>({color:colOf(f.properties), weight:opt.w||2, dashArray:opt.dash||null,
      fillColor:(opt.fill&&opt.fill.startsWith("rgba"))?colOf(f.properties):(opt.fill||color),
      fillOpacity:opt.fill?parseFloat(opt.fill.match(/[\d.]+(?=\))/)?.[0] ?? .2):0}),
    onEachFeature:(f,l)=>{ l.on("click", e=>{ if(window.showCard) showCard(f.properties, e.latlng, title_i18n(t, title), t); else L.popup().setLatLng(e.latlng).setContent(popup(f.properties)).openOn(map); });
      if(f.properties.name) l.bindTooltip(String(f.properties.name)); }
  });
}
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src+(src.includes("?")?"&":"?")+"d="+(location.hostname==="localhost"?Date.now():new Date().toISOString().slice(0,10)); sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
for(const [gname, gOn, layers] of GROUPS){
  for(const [t, title, kind, color, opt] of layers){
    const fc = DATA[t];
    if(!fc && edrLazy(t)){                       // heavy layer: placeholder group, data loads on first toggle
      const group = L.layerGroup(); const o = layerObjs[t] = {lyr:group, on:false, lazy:edrLazy(t), loaded:false, t, title, kind, color, opt};
      group.on("add", async ()=>{ if(o.loaded) return; o.loaded = true; const lz=o.lazy; if(window.showLoading) showLoading(lz.msg?(LANG==="en"?lz.msg[0]:lz.msg[1]):(LANG==="en"?"Loading…":"A carregar…")); const have=(function(){ try{ return typeof eval(lz.g)!=="undefined"; }catch(e){ return false; } })(); if(!have){ try{ window.__lazyLoads=window.__lazyLoads||{}; if(!window.__lazyLoads[lz.f]) window.__lazyLoads[lz.f]=loadScript(lz.f); await window.__lazyLoads[lz.f]; }catch(e){} } const src=(typeof window[lz.g]!=="undefined")?window[lz.g]:(function(){ try{ return eval(lz.g); }catch(e){ return {}; } })(); Object.assign(DATA, (window.edrAlias?edrAlias(src||{}):src)||{}); if(window.showLoading) showLoading(null);
        o.geo = buildLayer(t, title, kind, color, opt, DATA[t]); group.addLayer(o.geo); });
      continue;
    }
    if(!fc) continue;
    const lyr = buildLayer(t, title, kind, color, opt, fc);
    layerObjs[t] = {lyr, on:gOn, geo:lyr};
    if(gOn){ lyr.addTo(map);
      const b = lyr.getBounds();
      if(b.isValid()) allBounds = allBounds ? allBounds.extend(b) : b;
    }
  }
}
function fitAll(){ map.invalidateSize(); const est = layerObjs.cadastre_parcels ? layerObjs.cadastre_parcels.lyr.getBounds() : allBounds; if(est && est.isValid()) map.fitBounds(est.pad(0.04)); else map.setView(SITE.centre, SITE.zoom); }
fitAll();
// container may not have its final size yet — retry until the fit sticks
let fitTries = 0;
const fitTimer = setInterval(()=>{ fitTries++;
  if(map.getZoom() >= 5 || fitTries > 20) return clearInterval(fitTimer);
  fitAll(); }, 150);
// sidebar tree (rebuildable — bilingual)
const tree = document.getElementById("tree");
const OPEN_KEY = "edr_open_cats"; let openCats = new Set(); try{ openCats = new Set(JSON.parse(localStorage.getItem(OPEN_KEY)||"[]")); }catch(e){}
function saveOpen(){ try{ localStorage.setItem(OPEN_KEY, JSON.stringify([...openCats])); }catch(e){} }
function buildSidebar(){
  document.getElementById("ttl").textContent = UI[LANG].ttl;
  document.getElementById("sub").textContent = UI[LANG].sub;
  document.getElementById("place").textContent = SITE.place[LANG]; document.title = SITE.name + " — " + (LANG==="en" ? "Estate map" : "Mapa da Herdade");
  tree.innerHTML = "";
  const tools = document.createElement("div"); tools.className = "tree-tools";
  tools.innerHTML = `<span class="eyebrow">${LANG==="en"?"Layers by category":"Camadas por categoria"}</span><span><button id="tt-none">${LANG==="en"?"collapse all":"fechar todas"}</button></span>`;
  tree.appendChild(tools);
  for(const [gname, gOn, layers] of GROUPS){
    const present = layers.filter(([t])=>layerObjs[t]); if(!present.length) continue;
    const cat = document.createElement("div"); cat.className = "cat" + (openCats.has(gname) ? " open" : "");
    const onCount = present.filter(([t])=>map.hasLayer(layerObjs[t].lyr)).length;
    cat.innerHTML = `<div class="ch"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg><span class="ico">${catIcon(gname)}</span><span class="cn">${gname_i18n(gname).replace(/^[\d]+ · |^[^\w]+ /,"")}</span><span class="cc ${onCount?"on":""}">${onCount}/${present.length}</span><label class="tg" title="${LANG==="en"?"all":"todas"}"><input type="checkbox" class="gc" ${onCount===present.length?"checked":""}><i></i></label></div><div class="cb"></div>`;
    const body = cat.querySelector(".cb"); const cc = cat.querySelector(".cc"); const boxes = [];
    const refresh = ()=>{ const n = present.filter(([t])=>map.hasLayer(layerObjs[t].lyr)).length; cc.textContent = `${n}/${present.length}`; cc.classList.toggle("on", n>0); cat.querySelector(".gc").checked = n===present.length; };
    for(const [t,title,kind,color,opt] of present){
      const on = map.hasLayer(layerObjs[t].lyr);
      const row = document.createElement("label"); row.className = "lyr";
      const sw = document.createElement("span"); sw.className = "sw "+kind;
      sw.style.background = opt.cat ? Object.values(opt.colors)[0] : color; if(kind==="pg"){ sw.style.background = opt.fill||"transparent"; sw.style.borderColor = color; }
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = title_i18n(t, title);
      const tg = document.createElement("span"); tg.className = "tg"; const c = document.createElement("input"); c.type = "checkbox"; c.checked = on; tg.appendChild(c); tg.appendChild(document.createElement("i"));
      row.appendChild(sw); row.appendChild(nm); row.appendChild(tg); body.appendChild(row); boxes.push([c,t]);
      c.onchange = ()=>{ const o = layerObjs[t]; if(c.checked){ o.lyr.addTo(map); } else { map.removeLayer(o.lyr); } refresh(); };
      layerObjs[t].box = c;
    }
    cat.querySelector(".ch").onclick = e=>{ if(e.target.closest(".tg")) return; cat.classList.toggle("open"); cat.classList.contains("open") ? openCats.add(gname) : openCats.delete(gname); saveOpen(); };
    cat.querySelector(".gc").onchange = e=>{ boxes.forEach(([c])=>{ if(c.checked!==e.target.checked){ c.checked = e.target.checked; c.onchange(); } }); };
    tree.appendChild(cat);
  }
  document.getElementById("tt-none").onclick = ()=>{ openCats.clear(); saveOpen(); document.querySelectorAll(".cat").forEach(c=>c.classList.remove("open")); };
}
buildSidebar();
// ── live feeds: EFFIS (Copernicus) daily fire danger, hotspots, burnt areas ──
const today = new Date().toISOString().slice(0,10);
const EFFIS = "https://maps.effis.emergency.copernicus.eu/effis";
// EFFIS paints sea/no-data opaque white — a multiply blend makes white vanish and colours tint the imagery
map.createPane("effis"); map.getPane("effis").style.mixBlendMode = "multiply"; map.getPane("effis").style.zIndex = 350;
const LIVE = {
  fwi:  {pt:"Perigo de incêndio hoje (EFFIS FWI)", en:"Fire danger today (EFFIS FWI)",
         lyr: L.tileLayer.wms(EFFIS,{layers:"mf010.fwi",format:"image/png",opacity:.8,time:today,pane:"effis",attribution:"EFFIS © Copernicus"})},
  hs:   {pt:"Focos de calor ativos (satélite, 24h)", en:"Active fire hotspots (satellite, 24h)",
         lyr: L.tileLayer.wms(EFFIS,{layers:"all.hs",format:"image/png",pane:"effis",attribution:"EFFIS © Copernicus"})},
  ba:   {pt:"Áreas ardidas recentes (EFFIS)", en:"Recent burnt areas (EFFIS)",
         lyr: L.tileLayer.wms(EFFIS,{layers:"effis.nrt.ba",format:"image/png",opacity:.85,pane:"effis",attribution:"EFFIS © Copernicus"})},
};
function buildLive(){
  const el = document.getElementById("live"); el.innerHTML = ""; el.className = "cat" + (openCats.has("__live") ? " open" : "");
  const n = Object.values(LIVE).filter(v=>map.hasLayer(v.lyr)).length;
  el.innerHTML = `<div class="ch"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg><span class="cn">${LANG==="en"?"🛰️ Live satellite & risk":"🛰️ Satélite & risco — em direto"}</span><span class="cc ${n?"on":""}">${n}/${Object.keys(LIVE).length}</span></div><div class="cb"></div>`;
  const body = el.querySelector(".cb");
  for(const [k,v] of Object.entries(LIVE)){
    const row=document.createElement("label"); row.className="lyr";
    row.innerHTML = `<span class="sw pg" style="border-color:#c4502b;background:rgba(196,80,43,.25)"></span><span class="nm">${v[LANG]}</span><span class="tg"><input type="checkbox" ${map.hasLayer(v.lyr)?"checked":""}><i></i></span>`;
    row.querySelector("input").onchange = e=>{ e.target.checked ? v.lyr.addTo(map) : map.removeLayer(v.lyr); buildLive(); };
    body.appendChild(row);
  }
  const note=document.createElement("div"); note.style.cssText="font-size:10.5px;color:var(--muted);padding:4px 6px 0";
  const upd = (typeof SATDATA!=="undefined") ? SATDATA.updated : "—";
  note.textContent = LANG==="en" ? `Sentinel-2 vegetation series in zone cards · updated ${upd}` : `Série de vegetação Sentinel-2 nas fichas · atualizado ${upd}`;
  body.appendChild(note);
  el.querySelector(".ch").onclick = ()=>{ el.classList.toggle("open"); el.classList.contains("open") ? openCats.add("__live") : openCats.delete("__live"); saveOpen(); };
}
buildLive();
// ── IPMA daily fire-risk badge for Odemira (concelho 0211) ──
const RCM = {1:["Reduzido","Low","#8fae7e"],2:["Moderado","Moderate","#d4e157"],3:["Elevado","High","#ffb300"],4:["Muito elevado","Very high","#ff7043"],5:["Máximo","Maximum","#e53935"]};
let rcmToday = null;
function renderRisk(){
  const el = document.getElementById("risk");
  if(rcmToday == null){ el.innerHTML = ""; return; }
  const r = RCM[rcmToday] || ["?", "?", "#999"];
  el.innerHTML = `<b>${LANG==="en"?"Fire risk today":"Risco de incêndio hoje"}</b><span class="lvl" style="background:${r[2]}">${LANG==="en"?r[1]:r[0]}</span><small>IPMA · ${SITE.concelho} · ${today}</small>`;
}
fetch("https://api.ipma.pt/open-data/forecast/meteorology/rcm/rcm-d0.json").then(r=>r.json()).then(d=>{
  rcmToday = d.local && d.local[SITE.ipma] ? d.local[SITE.ipma].data.rcm : null; renderRisk();
}).catch(()=>{});
// language switch
const langsEl = document.getElementById("langs");
[["pt","PT"],["en","EN"]].forEach(([code,label])=>{
  const b=document.createElement("button"); b.textContent=label; b.dataset.lang=code;
  if(code===LANG) b.classList.add("on");
  b.onclick=()=>{ LANG=code; try{localStorage.setItem("edr_lang",code);}catch(e){}
    langsEl.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x.dataset.lang===code));
    buildSidebar(); buildLive(); renderRisk(); map.closePopup(); };
  langsEl.appendChild(b);
});
document.getElementById("burger").onclick=()=>document.getElementById("side").classList.toggle("open");
// ── legend: explains colours of the categorised layers that are on ──
const LEG = {buildings_pt:{pt:"Edifícios",en:"Buildings",vals:{registado:["#4caf50","Registado","Registered"],nao_registado_licenciado:["#ff3d3d","Não registado","Not registered"],por_classificar:["#ffc107","Por classificar","To classify"]}},
  tree_actions_pt:{pt:"Cortes",en:"Tree cuts",vals:{2024:["#bdbdbd","2024","2024"],2025:["#ff9800","2025","2025"],2026:["#ffeb3b","2026","2026"]}},
  tree_crowns:{pt:"Vigor 2025",en:"Vigour 2025",vals:{vigoroso:["#43a047","Vigoroso","Vigorous"],moderado:["#fdd835","Moderado","Moderate"],stressado:["#e53935","Stressado","Stressed"]}},
  defensible_space:{pt:"Espaço defensável",en:"Defensible space",vals:{boa:["#43a047","Boa","Good"],moderada:["#ffb300","Moderada","Moderate"],fraca:["#e53935","Fraca","Poor"]}},
  track_crossings:{pt:"Travessias",en:"Crossings",vals:{alto:["#e53935","Risco alto","High risk"],medio:["#ffb300","Médio","Medium"],baixo:["#8bc34a","Baixo","Low"]}},
  building_footprints:{pt:"Implantações",en:"Footprints",vals:{registado:["#66bb6a","Registado","Registered"],nao_registado_licenciado:["#ef5350","Não registado","Not registered"]}}};
const legendEl = document.createElement("div"); legendEl.className="legend"; legendEl.hidden=true; document.getElementById("map").appendChild(legendEl);
function renderLegend(){ const on = Object.keys(LEG).filter(t=>layerObjs[t] && map.hasLayer(layerObjs[t].lyr)); if(!on.length){ legendEl.hidden=true; return; }
  legendEl.hidden=false; legendEl.innerHTML = `<div class="lt">${LANG==="en"?"Legend":"Legenda"}</div>` + on.map(t=>`<div class="grpn">${LEG[t][LANG]}</div>` + Object.values(LEG[t].vals).map(([c,pt,en])=>`<div class="li"><span class="sw" style="background:${c}"></span>${LANG==="en"?en:pt}</div>`).join("")).join(""); }
map.on("layeradd layerremove", ()=>setTimeout(renderLegend, 50)); renderLegend();
// ── loading indicator for heavy layers ──
const loadEl = document.createElement("div"); loadEl.className="loading"; loadEl.hidden=true; loadEl.innerHTML=`<i></i><span></span>`; document.getElementById("map").appendChild(loadEl);
window.showLoading = (msg)=>{ loadEl.querySelector("span").textContent = msg; loadEl.hidden = !msg; };
// deep link: #asset=EDR-WTR-001 → zoom + open popup (for ClickUp task links)
function openAsset(){
  const m = location.hash.match(/#asset=([A-Z0-9-]+)/i);
  if(!m || !layerObjs.asset_registry) return;
  const o = layerObjs.asset_registry;
  if(!map.hasLayer(o.lyr)){ o.lyr.addTo(map); if(o.box) o.box.checked = true; }
  o.lyr.eachLayer(l=>{
    if(l.feature && l.feature.properties.asset_id === m[1].toUpperCase()){
      const ll = (typeof l.getLatLng === "function") ? l.getLatLng()
               : (typeof l.getBounds === "function" ? l.getBounds().getCenter() : null);
      if(ll){ map.setView(ll, 18); if(window.showCard) showCard(l.feature.properties, ll, 'EDR'); else l.openPopup(ll); }
    }});
}
// deep link: #work=FIRE-012 / PERMIT-003 / INSP-021 → zoom + popup on the related feature
function openWork(){
  const m = location.hash.match(/#work=([A-Z]+-\d{3})/i); if(!m) return;
  const key = m[1].toUpperCase(); let hit = null;
  const scan = (t, test) => { const o = layerObjs[t]; if(!o||hit) return; (o.geo||o.lyr).eachLayer(l=>{ if(!hit && l.feature && test(l.feature.properties)) hit = [o, l]; }); };
  scan("fire_fuel_strips", p=>p.key===key); scan("tree_permits", p=>p.key===key);
  scan("asset_registry", p=>Array.isArray(p.inspections) && p.inspections.some(i=>i.key===key));
  if(!hit) return;
  const [o, l] = hit; if(!map.hasLayer(o.lyr)){ o.lyr.addTo(map); if(o.box) o.box.checked = true; }
  const ll = (typeof l.getLatLng==="function") ? l.getLatLng() : l.getBounds().getCenter();
  map.setView(ll, 18); if(window.showCard) showCard(l.feature.properties, ll, key); else l.openPopup(ll);
}
window.addEventListener("hashchange", ()=>{ openAsset(); openWork(); });
setTimeout(()=>{ openAsset(); openWork(); }, 400);

#app{display:flex;height:calc(100vh - 44px)}
#side{width:300px;min-width:300px;background:var(--night);border-right:1px solid var(--line);overflow-y:auto;padding:14px 14px 40px;scrollbar-width:thin}

#map{flex:1;background:var(--bark)}

.pp .notes{margin-top:6px;font-size:11.5px;color:var(--muted);max-height:110px;overflow-y:auto;white-space:pre-wrap}
#burger{display:none;position:fixed;z-index:1200;top:52px;left:10px;background:var(--night);color:var(--linen);border:1px solid var(--line-2);border-radius:8px;padding:7px 11px;font-size:15px}
@media(max-width:700px){ #side{position:fixed;z-index:1100;top:44px;height:calc(100vh - 44px);transform:translateX(-100%);transition:transform .2s} #side.open{transform:none} #burger{display:block} }

.blk{margin:12px 0 0} .blk .bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px} .blk .bh .eyebrow{font-size:10px}
.basemaps{display:flex;gap:6px;margin:8px 0 2px} .basemaps button{flex:1;font:600 11px var(--ui);padding:6px 4px;background:var(--bark);color:var(--muted);border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:all .15s}
.basemaps button.on{color:var(--linen);border-color:var(--oak);box-shadow:inset 0 0 0 1px var(--oak)} .basemaps button:hover{color:var(--linen)}
#modes button{font-size:12px} #modes button.on{color:var(--bark);background:var(--straw);border-color:var(--straw)}

/* layer tree: categories as accordions with switches */
.cat{border:1px solid var(--line);border-radius:var(--r);margin:6px 0;background:var(--bark);overflow:hidden}
.cat .ch{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;user-select:none} .cat .ch:hover{background:var(--night-2)}

.sw{width:12px;height:12px;border-radius:3px;flex:none;border:1.5px solid transparent} .sw.ln{height:4px;border-radius:2px} .sw.pt{border-radius:50%}
.tg{position:relative;width:30px;height:18px;flex:none} .tg input{opacity:0;width:0;height:0;position:absolute} .tg i{position:absolute;inset:0;background:var(--line-2);border-radius:999px;transition:background .15s} .tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--linen-2);transition:transform .15s}

body.field .lyr{padding:9px 6px;font-size:14px} body.field .tg{transform:scale(1.15)}
.big{width:100%;padding:12px;font:700 14px var(--ui);border-radius:8px;border:1px solid var(--line);background:var(--oak);color:var(--bark);cursor:pointer}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5)} .pin.fire{background:#c4502b;border:2px solid #fff} .pin.rep{background:#7a2f22;border:2px solid #fff}
.windarrow{font-size:34px;color:#fff;text-shadow:0 0 6px #000,0 0 2px #000;line-height:40px;text-align:center}
.me{width:18px;height:18px;border-radius:50%;background:#6f9fc0;border:3px solid #fff;box-shadow:0 0 0 4px rgba(111,159,192,.35)}
#divider{position:absolute;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.6);z-index:800;cursor:col-resize;touch-action:none} #divider::after{content:"◀ ▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#111;font-size:11px;padding:4px 6px;border-radius:12px;white-space:nowrap}
.row2{display:flex;gap:6px;margin-top:4px} .row2 select{flex:1;background:var(--bark);color:var(--linen);border:1px solid var(--line);border-radius:6px;padding:5px;font:12px var(--ui)}

function satSeries(p){
  if(typeof SATDATA === "undefined" || !p.name) return null;
  const pts = [];
  for(const s of Object.values(SATDATA.series)){ if(s.name === p.name) pts.push(...s.pts); }
  if(!pts.length) return null;
  // average same-date readings across polygons sharing the name
  const byDate = {};
  for(const [d,ndvi,ndmi] of pts){ const b = byDate[d] = byDate[d] || [0,0,0]; b[0]+=ndvi; b[1]+=ndmi; b[2]++; }
  return Object.entries(byDate).sort().map(([d,b])=>[d, b[0]/b[2], b[1]/b[2]]);
}

  const x = i => pad + i*(W-2*pad)/(s.length-1), y = v => H-pad-((v-lo)/Math.max(hi-lo,0.05))*(H-2*pad);
  const path = vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");

    : `Vegetação (NDVI) · ${first[0].slice(5)} → ${last[0].slice(5)} · atual ${last[1].toFixed(2)} · humidade ${last[2].toFixed(2)}`;
  return `<div class="spark"><div class="lbl">🛰️ ${lbl} <b style="color:${trend<-0.05?'#ff7043':'#8fae7e'}">${trend>=0?'▲':'▼'}${Math.abs(trend).toFixed(2)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#8fae7e" stroke-width="1.8"/>
    <circle cx="${x(s.length-1).toFixed(1)}" cy="${y(last[1]).toFixed(1)}" r="2.6" fill="#ffeb3b"/></svg></div>`;
}

    if(l.feature && l.feature.properties.asset_id === m[1].toUpperCase()){
      const ll = (typeof l.getLatLng === "function") ? l.getLatLng()
               : (typeof l.getBounds === "function" ? l.getBounds().getCenter() : null);
      if(ll){ map.setView(ll, 18); if(window.showCard) showCard(l.feature.properties, ll, 'EDR'); else l.openPopup(ll); }
    }});
}
// deep link: #work=FIRE-012 / PERMIT-003 / INSP-021 → zoom + popup on the related feature
function openWork(){
  const m = location.hash.match(/#work=([A-Z]+-\d{3})/i); if(!m) return;
  const key = m[1].toUpperCase(); let hit = null;
  const scan = (t, test) => { const o = layerObjs[t]; if(!o||hit) return; (o.geo||o.lyr).eachLayer(l=>{ if(!hit && l.feature && test(l.feature.properties)) hit = [o, l]; }); };
  scan("fire_fuel_strips", p=>p.key===key); scan("tree_permits", p=>p.key===key);
  scan("asset_registry", p=>Array.isArray(p.inspections) && p.inspections.some(i=>i.key===key));
  if(!hit) return;
  const [o, l] = hit; if(!map.hasLayer(o.lyr)){ o.lyr.addTo(map); if(o.box) o.box.checked = true; }
  const ll = (typeof l.getLatLng==="function") ? l.getLatLng() : l.getBounds().getCenter();
  map.setView(ll, 18); if(window.showCard) showCard(l.feature.properties, ll, key); else l.openPopup(ll);
}
window.addEventListener("hashchange", ()=>{ openAsset(); openWork(); });
setTimeout(()=>{ openAsset(); openWork(); }, 400);
</script>
